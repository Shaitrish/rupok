[package]
name = "rupok-render"
description = "GPU ink renderer for rupok (wgpu: WebGPU/WebGL2 in the browser, Vulkan/Metal/DX12 natively)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rupok-ink.workspace = true
rupok-core.workspace = true
bytemuck.workspace = true
wgpu = { workspace = true, features = ["wgsl", "std", "parking_lot"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "metal", "dx12", "gles"] }
pollster.workspace = true
