[package]
name = "rupok-wasm"
description = "The rupok board engine: input gestures, tools, replay, and the wasm-bindgen API used by the UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rupok-ink.workspace = true
rupok-core.workspace = true
rupok-format.workspace = true
rupok-render.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["wgsl", "std", "parking_lot", "webgpu", "webgl"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement", "console"] }
