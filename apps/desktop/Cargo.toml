[package]
name = "rupok-desktop"
description = "Rupok desktop app (Tauri 2) for Windows and Linux, with the draw-over-any-app overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "rupok-desktop"

# A library plus a thin binary, as Tauri recommends. The `_lib` suffix avoids a
# bin/lib file-name clash on Windows (cargo#8519).
[lib]
name = "rupok_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "rupok-desktop"
path = "src/main.rs"

[features]
default = []
# The Tauri shell. Off by default so `cargo test --workspace` and
# `cargo clippy --workspace` stay green on machines and CI jobs without the
# WebKitGTK dev packages. `tauri.conf.json` (`build.features`) turns it on for
# `tauri dev` and `tauri build`.
app = [
  "capture",
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-fs",
  "dep:tauri-plugin-global-shortcut",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-window-state",
  "dep:notify",
  "dep:serde_json",
  "dep:percent-encoding",
  "dep:rupok-cli",
  "dep:webkit2gtk",
]
# Screen capture for the overlay's "Save to lesson" (no system libraries
# needed: pure-Rust X11 on Linux, xcap on Windows). Builds without WebKitGTK.
capture = ["dep:x11rb", "dep:xcap"]
# Offline voice input (speech-to-text) with whisper.cpp: the model is
# downloaded on demand from Settings, never bundled (voice.rs, voice_cmd.rs).
# Needs cmake and a C++ compiler. `tauri dev --features whisper`.
whisper = ["dep:whisper-rs", "dep:ureq", "dep:sha2"]

[dependencies]
rupok-format.workspace = true
thiserror.workspace = true
serde.workspace = true

tauri = { version = "2.12", optional = true , features = [] }
tauri-plugin-dialog = { version = "2.8", optional = true }
tauri-plugin-fs = { version = "2.7", optional = true }
tauri-plugin-global-shortcut = { version = "2.4", optional = true }
tauri-plugin-single-instance = { version = "2.5", optional = true }
tauri-plugin-window-state = { version = "2.5", optional = true }
percent-encoding = { version = "2", optional = true }
# The library folder watcher (library_cmd.rs).
notify = { version = "8", optional = true }
serde_json = { workspace = true, optional = true }
# The in-app AI chat: the `rupok agent` relay, run in-process (agent_cmd.rs).
rupok-cli = { workspace = true, optional = true }
# Offline voice input (feature `whisper`): whisper.cpp bindings, and the
# on-demand model download (HTTPS, checked against a pinned SHA-256).
whisper-rs = { version = "0.16", optional = true }
ureq = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true }
# Grants the board's microphone request (voice input) in WebKitGTK, which
# denies getUserMedia unless the app answers its permission request.
webkit2gtk = { version = "2.0", optional = true, features = ["v2_8"] }

[target.'cfg(windows)'.dependencies]
xcap = { version = "0.9", optional = true }

[build-dependencies]
tauri-build = { version = "2.7", optional = true , features = [] }

[dev-dependencies]
rupok-core.workspace = true
tempfile = "3"
