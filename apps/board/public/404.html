<!doctype html>
<!-- Served by Cloudflare for unknown paths (wrangler.jsonc: not_found_handling "404-page"). Self-contained: no build assets. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Rupok</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --ink: #111418; --ink-2: #3d434b; --line: #e7e8ea; --bg: #ffffff; --mint: #20c997; --mint-hover: #38d9a9; --mint-text: #087f5b; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #f4f5f6; --ink-2: #c5cad1; --line: #2a2f36; --bg: #111418; --mint: #3ee6b0; --mint-hover: #63e6be; --mint-text: #63e6be; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
        font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; }
      main { max-width: 520px; text-align: center; }
      .mark { width: 64px; height: 64px; border-radius: 16px; }
      .code { margin: 20px 0 4px; font-weight: 800; font-size: 14px; letter-spacing: 0.12em; color: var(--mint-text); }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; }
      p { margin: 0 0 24px; color: var(--ink-2); }
      .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a.btn { display: inline-block; padding: 12px 20px; border-radius: 999px; font-weight: 700; text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); }
      a.btn.primary { background: var(--mint); border-color: var(--mint); color: #111418; }
      a.btn:hover { border-color: var(--mint-hover); }
      a.btn.primary:hover { background: var(--mint-hover); }
      .bn { margin-top: 28px; font-size: 15px; }
      .bn a { color: var(--mint-text); }
    </style>
  </head>
  <body>
    <main>
      <a href="/" aria-label="Rupok home"><img class="mark" src="/icon-192.png" alt="" width="64" height="64" /></a>
      <div class="code">404</div>
      <h1>This page isn't here</h1>
      <p>The link may be old or mistyped. The board and everything else are one tap away.</p>
      <div class="links">
        <a class="btn primary" href="/board/">Open the board</a>
        <a class="btn" href="/">Rupok home</a>
      </div>
      <p class="bn" lang="bn">পাতাটি পাওয়া যায়নি। <a href="/bn/">বাংলা হোম</a> · <a href="/board/">বোর্ড খুলুন</a></p>
    </main>
  </body>
</html>
