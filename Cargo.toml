[workspace]
resolver = "3"
members = ["crates/rupok-ink", "crates/rupok-core", "crates/rupok-format", "crates/rupok-render", "crates/rupok-cli", "crates/rupok-wasm", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "AGPL-3.0-or-later"
repository = "https://github.com/shaitrish/rupok"
authors = ["Shaitrish and rupok contributors"]

[workspace.dependencies]
rupok-ink = { path = "crates/rupok-ink" }
rupok-core = { path = "crates/rupok-core" }
rupok-format = { path = "crates/rupok-format" }
rupok-render = { path = "crates/rupok-render" }

loro = "1.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rstar = "0.14"
blake3 = { version = "1.8", default-features = false }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wgpu = { version = "30", default-features = false }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3.107"
console_error_panic_hook = "0.1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
rmcp = "3.11"
schemars = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = 3
lto = "fat"
panic = "abort"
