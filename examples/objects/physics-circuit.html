<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohm's law: a simple circuit</title>
<!--
  rupok Smart Object: Physics, electric circuits and Ohm's law (Grade 8-10).
  Size 1920 x 1080 (full slide), 6 steps that build the circuit:
    0      an empty loop: what does a circuit need?
    1      the battery (voltage V)
    2      wires full of free electrons, switch open
    3      the resistor (resistance R)
    4      the bulb, still dark
    5      the switch closes: electrons flow, the bulb lights up
    6      Ohm's law: ammeter, live V = I x R and an I-V graph
  Electrons move at a speed that follows the current; the bulb's brightness
  follows its power. Tap the switch to open or close it. EN / Bangla toggle.
  Light and dark (chalkboard) schemes. V, R, switch and language are saved.
-->
<style>
  :root {
    --bg: var(--rupok-color-bg, #ffffff);
    --fg: var(--rupok-color-fg, #111418);
    --muted: var(--rupok-color-muted, #5f6670);
    --surface: var(--rupok-color-surface, #f4f5f4);
    --line: var(--rupok-color-line, rgba(17, 20, 24, 0.12));
    --accent: var(--rupok-color-accent, #0ca678);
    /* accent text (4.5:1 on the page), text on accent fills, highlight background */
    --accent-text: var(--rupok-color-accent-text, #087f5b);
    --on-accent: var(--rupok-color-on-accent, #04241b);
    --accent-soft: var(--rupok-color-accent-soft, #e6fcf5);
    --font: var(--rupok-font-body, "Inter Variable", Inter, "Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --font-h: var(--rupok-font-heading, var(--font));
    --sky: #1c7ed6; --coral: #f0533c; --sun: #f59f00;
    --glass: color-mix(in srgb, var(--bg) 90%, transparent);
    --shadow: 0 .75rem 2.5rem rgba(17, 20, 24, .14), 0 .125rem .375rem rgba(17, 20, 24, .08);
    --hl: var(--accent-soft);
  }
  :root[data-scheme="dark"] {
    --sky: #74c0fc; --coral: #ff8a7a; --sun: #ffd43b;
    --glass: color-mix(in srgb, var(--bg) 86%, transparent);
    --shadow: 0 .75rem 2.5rem rgba(0, 0, 0, .45), 0 .125rem .375rem rgba(0, 0, 0, .3);
  }
  /* Designed at 1280 x 720: 1rem = 16px there (24px on a 1920 slide). */
  html { font-size: min(calc(100vw * 16 / 1280), calc(100vh * 16 / 720)); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-user-select: none; user-select: none; }
  canvas#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top { position: fixed; left: 2.5rem; top: 2rem; right: 2.5rem; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .eyebrow { margin: 0 0 .4rem; font: 800 1rem/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
  h1 { margin: 0; font: 900 3.25rem/1.05 var(--font-h); letter-spacing: -.035em; }
  .caption { margin: .75rem 0 0; max-width: 46rem; font: 500 1.625rem/1.3 var(--font); color: var(--muted); }
  .caption b { color: var(--fg); font-weight: 750; }
  /* Tracking breaks Bengali conjuncts: Bangla text keeps normal spacing. */
  html[lang="bn"] .eyebrow, html[lang="bn"] h1, html[lang="bn"] .card .k { letter-spacing: 0; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 1rem; }
  .row { display: flex; align-items: center; gap: 1.25rem; }
  .dots { display: flex; gap: .5rem; }
  .dots i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--line); transition: background-color .3s, transform .3s; }
  .dots i.on { background: var(--accent); }
  .dots i.now { transform: scale(1.4); }
  .lang { display: flex; padding: .25rem; gap: .25rem; border-radius: 999px; background: linear-gradient(var(--surface), var(--surface)), var(--glass); border: .0625rem solid var(--line); box-shadow: var(--shadow); }
  .lang button { min-height: 3rem; min-width: 4.75rem; padding: 0 1rem; border: 0; border-radius: 999px; font: 750 1.125rem/1 var(--font); color: var(--muted); background: transparent; cursor: pointer; touch-action: manipulation; }
  .lang button.on { background: var(--accent); color: var(--on-accent); }
  .lang button:focus-visible, .flow:focus-visible { outline: .2rem solid var(--fg); outline-offset: .15rem; }

  .card {
    background: linear-gradient(var(--surface), var(--surface)), var(--glass); 
    border: .0625rem solid var(--line); border-radius: 1.25rem; box-shadow: var(--shadow);
  }
  .eq { width: 24rem; padding: 1rem 1.375rem 1.125rem; display: grid; gap: .55rem; justify-items: start; }
  .eq .k { font: 800 .9375rem/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .eq .line { font: 600 1.7rem/1.3 var(--font); min-height: 1.3em; }
  .eq .vals { font: 600 1.25rem/1.3 var(--font); color: var(--muted); }
  .eq .vals b { color: var(--fg); font-weight: 750; }
  .swap { animation: swap .45s ease-out; }
  @keyframes swap { from { opacity: 0; transform: translateY(-.5rem); } to { opacity: 1; transform: none; } }
  /* Floating labels on the scene, typeset with LaTeX (tag()). */
  .tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; padding: .32rem .7rem; border-radius: 999px; white-space: nowrap; font: 650 1.15rem/1.15 var(--font); color: var(--fg); background: color-mix(in srgb, var(--bg) 90%, transparent); border: .1rem solid var(--line); will-change: transform; }
  .tag.bare { padding: 0 .1rem; background: none; border: 0; border-radius: 0; text-shadow: 0 0 .2em var(--bg), 0 0 .2em var(--bg), 0 0 .08em var(--bg); }
  /* Plain-HTML stand-in for maths until KaTeX has loaded. */
  .tx { font-style: normal; }
  .nw { white-space: nowrap; }
  .tx sub, .tx sup { font-size: .68em; }
  .hl { color: var(--accent-text); background: var(--hl); border-radius: .4rem; padding: 0 .12em; transition: background-color .3s; }
  .fx i { font-style: italic; }
  .graph { position: relative; width: 24rem; height: 13.5rem; padding: .875rem 1rem .5rem; }
  .graph .k { position: absolute; left: 1.125rem; top: .875rem; font: 800 .9375rem/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .graph canvas { position: absolute; inset: 2.25rem .75rem .5rem .5rem; width: calc(100% - 1.25rem); height: calc(100% - 2.75rem); }
  .hidden { display: none !important; }

  .dock {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
    display: flex; align-items: center; gap: 1rem; padding: .625rem 1rem .625rem 1.5rem; border-radius: 999px;
  }
  .dock .sep { width: .0625rem; align-self: stretch; margin: .375rem 0; background: var(--line); }
  .ctl { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: .1rem .9rem; width: 19rem; transition: opacity .4s; }
  .ctl.off { opacity: .3; pointer-events: none; }
  .ctl .name { font: 800 1.125rem/1 var(--font); color: var(--muted); }
  .ctl .val { justify-self: end; font: 850 1.625rem/1 var(--font); font-variant-numeric: tabular-nums; }
  .ctl input { grid-column: 1 / 3; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2.5rem; margin: 0; background: transparent; cursor: pointer; touch-action: none; }
  input[type=range]::-webkit-slider-runnable-track { height: .5rem; border-radius: 999px; background: linear-gradient(to right, var(--accent) var(--p, 50%), var(--line) var(--p, 50%)); }
  input[type=range]::-moz-range-track { height: .5rem; border-radius: 999px; background: var(--line); }
  input[type=range]::-moz-range-progress { height: .5rem; border-radius: 999px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 2.5rem; height: 2.5rem; margin-top: -1rem; border-radius: 50%; background: var(--bg); border: .25rem solid var(--accent); box-shadow: 0 .125rem .5rem rgba(0,0,0,.25); }
  input[type=range]::-moz-range-thumb { width: 2rem; height: 2rem; border-radius: 50%; background: var(--bg); border: .25rem solid var(--accent); }
  input[type=range]:focus-visible { outline: .2rem solid var(--fg); outline-offset: .2rem; border-radius: .5rem; }
  .flow { display: inline-flex; align-items: center; justify-content: center; width: 4rem; height: 4rem; border-radius: 50%; border: .125rem solid var(--line); background: transparent; color: var(--fg); cursor: pointer; touch-action: manipulation; }
  .flow svg { width: 1.6rem; height: 1.6rem; fill: currentColor; }
  .flow:disabled { opacity: .3; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <canvas id="cv" aria-label="Circuit. Tap the switch to open or close it."></canvas>

  <div class="top">
    <div>
      <p class="eyebrow" id="eyebrow">Physics · Electricity</p>
      <h1 id="title">Ohm's law: a simple circuit</h1>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <div class="right">
      <div class="row">
        <div class="dots" id="dots" aria-hidden="true"></div>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" id="lang-en" class="on" aria-pressed="true">EN</button>
          <button type="button" id="lang-bn" lang="bn" aria-pressed="false">বাংলা</button>
        </div>
      </div>
      <div class="card eq" id="eq" aria-live="polite"></div>
      <div class="card graph hidden" id="graph"><span class="k" id="graph-k">I–V graph</span><canvas id="gcv" aria-label="Current against voltage"></canvas></div>
    </div>
  </div>

  <div class="card dock">
    <label class="ctl off" id="c-v"><span class="name" id="l-v">Voltage V</span><span class="val" id="v-val">6 V</span>
      <input type="range" id="volt" min="0" max="12" step="0.5" value="6" aria-label="Battery voltage in volts"></label>
    <span class="sep"></span>
    <label class="ctl off" id="c-r"><span class="name" id="l-r">Resistance R</span><span class="val" id="r-val">4 Ω</span>
      <input type="range" id="res" min="1" max="20" step="1" value="4" aria-label="Resistance in ohms"></label>
    <span class="sep"></span>
    <button class="flow" id="flow" type="button" aria-label="Pause electrons" disabled><svg viewBox="0 0 24 24" aria-hidden="true" id="flow-icon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
  </div>

<script>
  /* rupok injects window.rupok before this script runs. This small stand-in
     is only used when the file is opened directly in a browser without the SDK,
     so the object still previews (arrow keys step through it). */
  const rupok = window.rupok || (function () {
    let cur = 0, count = 0, saved;
    const subs = [];
    const set = (n) => {
      n = Math.max(0, Math.min(count, n));
      if (n !== cur) { cur = n; subs.forEach((f) => f(cur, { source: "local" })); }
    };
    document.addEventListener("keydown", (e) => {
      const k = e.key, tag = e.target.tagName;
      if (tag === "INPUT") return;
      if (k === "ArrowRight" || k === "PageDown" || (k === " " && tag !== "BUTTON")) { e.preventDefault(); set(cur + 1); }
      if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); set(cur - 1); }
    });
    return {
      mode: "present",
      ready: Promise.resolve({ standalone: true }),
      steps: {
        get current() { return cur; },
        get count() { return count; },
        setCount(n) { count = n; set(cur); },
        onChange(f) { subs.push(f); setTimeout(() => f(cur, { source: "init" })); return () => {}; },
        next() { set(cur + 1); },
        prev() { set(cur - 1); },
        goto: set,
      },
      state: { load: () => saved, save: (v) => { saved = v; } },
      theme: { get: (k, d) => d, all: () => ({}), onChange: () => () => {} },
      quiz: { submit() {} },
      resize() {},
      log() {},
    };
  })();

  const STEPS = 6;
  const R_BULB = 2;
  const P_MAX = (12 / (1 + R_BULB)) ** 2 * R_BULB;

  const TEXT = {
    en: {
      eyebrow: "Physics · Electricity",
      title: "Ohm's law: a simple circuit",
      caps: [
        "Build a circuit one part at a time. <b>What does it need?</b>",
        "A <b>battery</b> gives the push. Its <b>voltage $V$</b> is measured in volts.",
        "<b>Wires</b> are full of free electrons. The switch is <b>open</b>: nothing flows.",
        "A <b>resistor</b> limits the current. <b>Resistance $R$</b> is measured in ohms ($\\Omega$).",
        "The <b>bulb</b> turns electrical energy into light. Still open: it stays dark.",
        "Switch <b>closed</b>: electrons flow from $-$ to $+$, and the bulb lights up.",
        "<b>Ohm's law: $V = IR$.</b> More volts, more current. More ohms, less.",
      ],
      heads: ["A circuit needs", "Voltage", "Current", "Resistance", "Total resistance", "Current", "Ohm's law"],
      need: "a closed loop + a push",
      vals: ["Battery · wires · resistor · bulb", "the push from the battery", "open switch: no flow", "it slows the flow down", "the bulb resists too", "amps = coulombs per second", ""],
      battery: "Battery", resistor: "Resistor", bulb: "Bulb", sw: "Switch", ammeter: "Ammeter",
      open: "open", closed: "closed", tap: "tap to switch",
      v: "Voltage $V$", r: "Resistance $R$", electron: "free electron (−)",
      graph: "I–V graph", gx: "V (volts)", gy: "I (A)", total: "$R$ = resistor + bulb ($2\\,\\Omega$)",
    },
    bn: {
      eyebrow: "পদার্থবিজ্ঞান · তড়িৎ",
      title: "ওহমের সূত্র: একটি সরল বর্তনী",
      caps: [
        "একটি একটি অংশ যোগ করে বর্তনী বানাও। <b>কী কী লাগবে?</b>",
        "<b>ব্যাটারি</b> ধাক্কা দেয়। এর <b>বিভব $V$</b> মাপা হয় ভোল্টে।",
        "<b>তারে</b> অনেক মুক্ত ইলেকট্রন আছে। সুইচ <b>খোলা</b>, তাই প্রবাহ নেই।",
        "<b>রোধক</b> প্রবাহ কমায়। <b>রোধ $R$</b> মাপা হয় ওহমে ($\\Omega$)।",
        "<b>বাল্ব</b> তড়িৎ শক্তিকে আলোতে বদলায়। সুইচ খোলা, তাই বাল্ব নেভা।",
        "সুইচ <b>বন্ধ</b>: ইলেকট্রন $-$ থেকে $+$ দিকে চলে, বাল্ব জ্বলে ওঠে।",
        "<b>ওহমের সূত্র: $V = IR$.</b> বিভব বাড়লে প্রবাহ বাড়ে, রোধ বাড়লে কমে।",
      ],
      heads: ["বর্তনীতে লাগে", "বিভব", "প্রবাহ", "রোধ", "মোট রোধ", "প্রবাহ", "ওহমের সূত্র"],
      need: "বন্ধ পথ + একটি ধাক্কা",
      vals: ["ব্যাটারি · তার · রোধক · বাল্ব", "ব্যাটারির ধাক্কা", "সুইচ খোলা: প্রবাহ নেই", "এটি প্রবাহ ধীর করে", "বাল্বেরও রোধ আছে", "অ্যাম্পিয়ার = কুলম্ব প্রতি সেকেন্ড", ""],
      battery: "ব্যাটারি", resistor: "রোধক", bulb: "বাল্ব", sw: "সুইচ", ammeter: "অ্যামিটার",
      open: "খোলা", closed: "বন্ধ", tap: "ছুঁয়ে বদলাও",
      v: "বিভব $V$", r: "রোধ $R$", electron: "মুক্ত ইলেকট্রন (−)",
      graph: "I–V লেখচিত্র", gx: "V (ভোল্ট)", gy: "I (A)", total: "$R$ = রোধক + বাল্ব ($2\\,\\Omega$)",
    },
  };

  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");

  /* ---------------------------------------------------------- LaTeX
     Maths is typeset by the SDK (rupok.tex / data-tex, KaTeX from rupoklib).
     Until KaTeX has loaded, or when this file is opened without Rupok, a
     plain-HTML approximation stands in. */
  const TEX_SYM = { theta: "θ", pi: "π", times: "×", cdot: "·", Delta: "Δ", Omega: "Ω", to: "→", longrightarrow: "→", circ: "°", approx: "≈", quad: " ", ",": " ", ";": " ", ":": " ", "!": "", sin: "sin ", cos: "cos ", tan: "tan " };
  function texHtml(t) {
    let s = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    for (let i = 0; i < 2; i++) s = s.replace(/\\hl\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g, '<span class="hl">$1</span>');
    s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, "$1/$2").replace(/\\(?:mathrm|text|mathit|operatorname)\{([^{}]*)\}/g, "$1");
    s = s.replace(/\\([A-Za-z]+|[,;:!])/g, (m, w) => TEX_SYM[w] ?? "");
    s = s.replace(/\^\{([^{}]*)\}|\^(\S)/g, (m, a, b) => `<sup>${a ?? b}</sup>`).replace(/_\{([^{}]*)\}|_(\S)/g, (m, a, b) => `<sub>${a ?? b}</sub>`);
    return `<span class="tx">${s.replace(/[{}]/g, "").replace(/(^|[^a-z"])-/g, "$1−")}</span>`;
  }
  /* Typeset `src` into `el`; cheap to call again with the same formula. */
  function tex(el, src, display) {
    if (!el.querySelector(".katex")) el.innerHTML = texHtml(src);
    if (rupok.tex) rupok.tex(el, src, { display: !!display });
  }
  /* Rich text with $…$ formulas (captions): each becomes a [data-tex] span the SDK typesets. */
  function rich(el, html) {
    /* punctuation right after a formula stays on its line */
    el.innerHTML = html.replace(/\$([^$]+)\$([.,;:!?)]*)/g, (m, t, p) =>
      `<span class="nw"><span data-tex="${t.replace(/&/g, "&amp;").replace(/"/g, "&quot;")}">${texHtml(t)}</span>${p}</span>`);
    if (rupok.math) rupok.math.render(el);
  }
  const gcv = $("gcv"), gctx = gcv.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let volts = 6, ohms = 4, switchOn = true, lang = "en", paused = false;
  let step = 0, focus = null, focusTimer = 0;
  let W = 0, H = 0, R = 16, GW = 0, GH = 0;
  let raf = 0, last = 0, drift = 0;
  let electrons = [];
  const appear = {};
  let C = {};

  /* ---------------------------------------------------------- colour */
  const pc = document.createElement("canvas").getContext("2d");
  function rgba(c) {
    pc.fillStyle = "#000"; pc.fillStyle = c; const s = pc.fillStyle;
    if (s[0] === "#") return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16), 1];
    const m = s.match(/[\d.]+/g) || [0, 0, 0, 1];
    return [+m[0], +m[1], +m[2], m[3] === undefined ? 1 : +m[3]];
  }
  function mix(a, b, t, alpha = 1) {
    const x = rgba(a), y = rgba(b), m = (i) => Math.round(x[i] + (y[i] - x[i]) * t);
    return `rgba(${m(0)}, ${m(1)}, ${m(2)}, ${alpha})`;
  }
  function readTheme() {
    const s = getComputedStyle(document.documentElement), v = (n, fb) => s.getPropertyValue(n).trim() || fb;
    C = { bg: v("--bg", "#fff"), fg: v("--fg", "#111418"), muted: v("--muted", "#5f6670"), line: v("--line", "rgba(17,20,24,.12)"),
      accent: v("--accent", "#0ca678"), accentText: v("--accent-text", "#087f5b"), onAccent: v("--on-accent", "#04241b"), sky: v("--sky", "#1c7ed6"), coral: v("--coral", "#f0533c"), sun: v("--sun", "#f59f00"), font: v("--font", "system-ui, sans-serif") };
    const L = rgba(C.bg); C.dark = document.documentElement.getAttribute("data-scheme") === "dark" || (0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2]) / 255 < 0.45;
    C.wire = mix(C.bg, C.fg, 0.82);
  }
  const t = () => TEXT[lang];

  /* ---------------------------------------------------------- physics */
  const closed = () => step >= 5 && switchOn;
  const current = () => (closed() ? volts / (ohms + R_BULB) : 0);
  const bulbPower = () => current() ** 2 * R_BULB;
  const fmt = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));

  /* ---------------------------------------------------------- geometry */
  function geom() {
    const x0 = W * 0.09, x1 = W * 0.63, y0 = H * 0.47, y1 = H * 0.76, ym = (y0 + y1) / 2;
    const bh = 7 * R;
    const sw = { x: x0 + (x1 - x0) * 0.26, len: 5.5 * R };
    const am = { x: x0 + (x1 - x0) * 0.66, r: 2 * R };
    const pts = [[x0, ym - bh / 2], [x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, ym + bh / 2]];
    const segs = []; let L = 0;
    for (let i = 0; i < pts.length - 1; i++) {

  /* ---------------------------------------------------------- drawing */

    text(ctx, fmt(volts) + " V", x + w / 2 + 1.1 * R, y + 0.85 * R, C.accentText, 1.75, "left", 850);
  }

  function drawWires(g, k) {

    ctx.beginPath(); g.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();

  }

  function drawBulb(g, now) {
    const x = g.bulbX, y = g.y0, rG = 3.1 * R, cy = y - 4.6 * R;

    ctx.strokeStyle = C.dark ? "#6b7480" : "#5f6878"; ctx.lineWidth = 0.13 * R;

  /* ---------------------------------------------------------- graph */
  function drawGraph() {

    for (let v = 0; v <= 12; v += 3) { g.beginPath(); g.moveTo(X(v), tp); g.lineTo(X(v), tp + ph); g.stroke(); }
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(l, Y(i)); g.lineTo(l + pw, Y(i)); g.stroke(); }
    g.strokeStyle = C.fg; g.lineWidth = 2; g.beginPath(); g.moveTo(l, tp); g.lineTo(l, tp + ph); g.lineTo(l + pw, tp + ph); g.stroke();

    for (let i = 0; i <= 4; i += 2) text(g, String(i), l - 0.6 * R, Y(i), C.muted, 1, "right", 650);
    text(g, t().gx, l + pw, tp + ph + 1.75 * R, C.muted, 1, "right", 650);

  /* ---------------------------------------------------------- equation card */
  /* One line of maths in the equation card; \hl{…} marks the quantity that changes. */
  function eqLine(src) {
    const el = document.createElement("div"); el.className = "line";
    tex(el, src);
    return el;
  }
  const HL = (s, on = true) => (on ? `\\hl{${s}}` : s);
  function renderEq(swap) {
    const box = $("eq"), L = t(), I = current(), Rt = ohms + R_BULB;
    box.textContent = "";
    const head = document.createElement("span"); head.className = "k"; head.textContent = L.heads[step]; box.appendChild(head);
    const vals = document.createElement("div"); vals.className = "vals";
    rich(vals, L.vals[step]);
    if (step === 0) {
      const d = document.createElement("div"); d.className = "line"; d.style.fontSize = "1.6rem"; d.style.fontWeight = "750"; d.textContent = L.need; box.appendChild(d);
    } else if (step === 1) box.appendChild(eqLine(`\\hl{V} = ${fmt(volts)}\\,\\text{V}`));
    else if (step === 2) box.appendChild(eqLine(`\\hl{I} = 0\\,\\text{A}`));
    else if (step === 3) box.appendChild(eqLine(`\\hl{R} = ${fmt(ohms)}\\,\\Omega`));
    else if (step === 4) box.appendChild(eqLine(`R = ${fmt(ohms)}\\,\\Omega + \\hl{2\\,\\Omega} = ${fmt(Rt)}\\,\\Omega`));
    else if (step === 5) box.appendChild(eqLine(`\\hl{I} = \\dfrac{V}{R} = \\dfrac{${fmt(volts)}\\,\\text{V}}{${fmt(Rt)}\\,\\Omega} = \\hl{${I.toFixed(2)}\\,\\text{A}}`));
    else {
      const fv = focus === "v", fr = focus === "r", fi = !!focus;
      box.appendChild(eqLine(`${HL("V", fv)} = ${HL("I", fi || !focus)} \\times ${HL("R", fr)}`));
      box.appendChild(eqLine(`${HL(fmt(volts) + "\\,\\text{V}", fv)} = ${HL(I.toFixed(2) + "\\,\\text{A}", fi)} \\times ${HL(fmt(Rt) + "\\,\\Omega", fr)}`));
      rich(vals, L.total);
    }
    box.appendChild(vals);
    if (swap) { box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap"); }
  }

  /* ---------------------------------------------------------- panel */
  function syncControls() {
    const L = t();
    $("v-val").textContent = fmt(volts) + " V"; $("r-val").textContent = fmt(ohms) + " Ω";
    for (const [id, v] of [["volt", volts], ["res", ohms]]) { const el = $(id); el.value = v; el.style.setProperty("--p", ((v - el.min) / (el.max - el.min)) * 100 + "%"); }
    $("c-v").classList.toggle("off", step < 1); $("c-r").classList.toggle("off", step < 3);
    rich($("l-v"), L.v); rich($("l-r"), L.r);
    $("flow").disabled = !closed();
    $("flow-icon").innerHTML = paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    $("graph").classList.toggle("hidden", step < 6);
    $("graph-k").textContent = L.graph;
    drawGraph();
  }
  function applyLang() {
    const L = t();
    document.documentElement.lang = lang;
    $("eyebrow").textContent = L.eyebrow; $("title").textContent = L.title; rich($("caption"), L.caps[step]);
    for (const [id, on] of [["lang-en", lang === "en"], ["lang-bn", lang === "bn"]]) { $(id).classList.toggle("on", on); $(id).setAttribute("aria-pressed", String(on)); }
    syncControls(); renderEq(false); draw();
  }
  function persist() { rupok.state.save({ volts, ohms, switchOn, lang }); }
  function setFocus(f) { focus = f; clearTimeout(focusTimer); focusTimer = setTimeout(() => { focus = null; renderEq(false); }, 1400); }

  /* ---------------------------------------------------------- steps */
  const PARTS = [[1, "battery"], [2, "wires"], [3, "resistor"], [4, "bulb"], [6, "ammeter"]];
  function renderStep(s, info) {
    const animate = !info || info.source !== "init";
    const now = performance.now();
    for (const [at, part] of PARTS) {
      if (s < at) delete appear[part];
      else if (appear[part] === undefined) appear[part] = animate && s === at ? now : -1e9;
    }
    if (s >= 5 && step < 5) switchOn = true;
    step = s;
    document.querySelectorAll("#dots i").forEach((d, i) => { d.classList.toggle("on", i <= s); d.classList.toggle("now", i === s); });
    rich($("caption"), t().caps[s]);
    if (animate) { $("caption").classList.remove("swap"); void $("caption").offsetWidth; $("caption").classList.add("swap"); }
    syncControls(); renderEq(animate); draw();
  }

  /* ---------------------------------------------------------- events */
  for (let i = 0; i <= STEPS; i++) $("dots").appendChild(document.createElement("i"));
  $("volt").addEventListener("input", (e) => { volts = +e.target.value; setFocus("v"); syncControls(); renderEq(false); draw(); });
  $("res").addEventListener("input", (e) => { ohms = +e.target.value; setFocus("r"); syncControls(); renderEq(false); draw(); });
  for (const id of ["volt", "res"]) {
    $(id).addEventListener("change", persist);
    /* Give keyboard focus back after a touch, so the presenter's clicker keeps stepping. */
    $(id).addEventListener("pointerup", (e) => setTimeout(() => e.target.blur(), 0));
  }
  $("lang-en").addEventListener("click", () => { lang = "en"; applyLang(); persist(); });
  $("lang-bn").addEventListener("click", () => { lang = "bn"; applyLang(); persist(); });
  $("flow").addEventListener("click", () => { paused = !paused; syncControls(); draw(); });
  cv.addEventListener("click", (e) => {
    if (step < 5) return;
    const g = geom(), x = e.clientX, y = e.clientY;
    if (x > g.sw.x - 1.5 * R && x < g.sw.x + g.sw.len + 1.5 * R && y > g.y1 - 4 * R && y < g.y1 + 3.8 * R) {
      switchOn = !switchOn; paused = false; syncControls(); renderEq(false); draw(); persist();
    }
  });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    const g = geom(), n = Math.round(g.L / (2.4 * R));
    electrons = Array.from({ length: n }, (_, i) => (i * g.L) / n);
    draw();
  }
  function resizeGraph() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), r = gcv.getBoundingClientRect();
    GW = r.width; GH = r.height;
    gcv.width = Math.round(GW * dpr); gcv.height = Math.round(GH * dpr); gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGraph();
  }

  readTheme();
  new ResizeObserver(resize).observe(document.documentElement);
  new ResizeObserver(resizeGraph).observe(gcv);
  rupok.theme.onChange(() => { readTheme(); syncControls(); draw(); });
  rupok.steps.setCount(STEPS);
  rupok.ready.then(() => {
    const saved = rupok.state.load();
    if (saved && typeof saved === "object") {
      if (Number.isFinite(saved.volts)) volts = Math.max(0, Math.min(12, Math.round(saved.volts * 2) / 2));
      if (Number.isFinite(saved.ohms)) ohms = Math.max(1, Math.min(20, Math.round(saved.ohms)));
      if (typeof saved.switchOn === "boolean") switchOn = saved.switchOn;
      if (saved.lang === "en" || saved.lang === "bn") lang = saved.lang;
    }
    readTheme(); applyLang();
    rupok.steps.onChange(renderStep);
  });
</script>
</body>
</html>
