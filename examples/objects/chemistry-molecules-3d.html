<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molecules in 3D</title>
<!--
  rupok Smart Object: Chemistry, molecular shapes and VSEPR (Grade 9-12).
  Size 1920 x 1080 (full slide), 4 steps:
    0      the atoms of the chosen molecule, side by side (count them)
    1      atoms fly into place one by one (real VSEPR geometry)
    2      bonds form (single, double, aromatic ring)
    3      lone-pair lobes, bond-angle arcs and the shape name
    4      CH4, NH3 and H2O side by side: lone pairs squeeze the angle
  Molecules: H2O, CO2, CH4, NH3, C2H5OH, C6H6. Ball-and-stick and
  space-filling (they morph), CPK colours, physically based materials,
  soft contact shadow, gentle auto-rotation until touched. Drag to rotate,
  pinch or scroll to zoom. Uses three.js from rupoklib. Light and dark
  schemes. The molecule and view mode are saved with the lesson.
-->
<link rel="stylesheet" href="rupoklib://katex/katex.min.css">
<script src="rupoklib://katex/katex.min.js"></script>
<style>
  :root {
    --bg: var(--rupok-color-bg, #ffffff);
    --fg: var(--rupok-color-fg, #111418);
    --muted: var(--rupok-color-muted, #5f6670);
    --surface: var(--rupok-color-surface, #f4f5f4);
    --line: var(--rupok-color-line, rgba(17, 20, 24, 0.12));
    --accent: var(--rupok-color-accent, #0ca678);
    /* accent text (4.5:1 on the page), text on accent fills, highlight background */
    --accent-text: var(--rupok-color-accent-text, #087f5b);
    --on-accent: var(--rupok-color-on-accent, #04241b);
    --accent-soft: var(--rupok-color-accent-soft, #e6fcf5);
    --font: var(--rupok-font-body, "Inter Variable", Inter, "Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --font-h: var(--rupok-font-heading, var(--font));
    --glass: color-mix(in srgb, var(--bg) 90%, transparent);
    --shadow: 0 .75rem 2.5rem rgba(17, 20, 24, .14), 0 .125rem .375rem rgba(17, 20, 24, .08);
    --hl: var(--accent-soft);
    --halo: color-mix(in srgb, var(--accent) 7%, transparent);
  }
  :root[data-scheme="dark"] {
    --glass: color-mix(in srgb, var(--bg) 86%, transparent);
    --shadow: 0 .75rem 2.5rem rgba(0, 0, 0, .45), 0 .125rem .375rem rgba(0, 0, 0, .3);
    --halo: color-mix(in srgb, var(--accent) 14%, transparent);
  }
  /* Designed at 1280 x 720: 1rem = 16px there (24px on a 1920 slide). */
  html { font-size: min(calc(100vw * 16 / 1280), calc(100vh * 16 / 720)); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-user-select: none; user-select: none; }
  .halo { position: fixed; inset: 0; background: radial-gradient(ellipse 45% 50% at 46% 56%, var(--halo), transparent 70%); pointer-events: none; }
  #view { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #view.dragging { cursor: grabbing; }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transition: opacity .35s; }
  .lbl.atom { font: 850 1.15rem/1 var(--font); }
  .lbl.angle { padding: .35rem .7rem; border-radius: 999px; font: 850 1.3rem/1 var(--font); color: var(--fg); background: var(--glass); border: .14rem solid var(--accent); box-shadow: var(--shadow); }
  .lbl.cap { display: grid; justify-items: center; gap: .35rem; text-align: center; }
  .lbl.cap b { font: 900 1.9rem/1 var(--font); }
  .lbl.cap span { font: 650 1.2rem/1.1 var(--font); color: var(--muted); }
  .lbl.cap em { font: 850 1.6rem/1 var(--font); font-style: normal; color: var(--accent-text); }
  .lbl.count { font: 700 1.4rem/1 var(--font); color: var(--muted); }

  .top { position: fixed; left: 2.5rem; top: 2rem; right: 2.5rem; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .eyebrow { margin: 0 0 .4rem; font: 800 1rem/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
  h1 { margin: 0; font: 900 3.25rem/1.05 var(--font-h); letter-spacing: -.035em; }
  .caption { margin: .75rem 0 0; max-width: 40rem; font: 500 1.625rem/1.3 var(--font); color: var(--muted); }
  .caption b { color: var(--fg); font-weight: 750; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 1rem; }
  .dots { display: flex; gap: .5rem; padding: .25rem 0; }
  .dots i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--line); transition: background-color .3s, transform .3s; }
  .dots i.on { background: var(--accent); }
  .dots i.now { transform: scale(1.4); }
  .card { background: linear-gradient(var(--surface), var(--surface)), var(--glass); border: .0625rem solid var(--line); border-radius: 1.25rem; box-shadow: var(--shadow); }
  .info { width: 22rem; padding: 1rem 1.375rem 1.125rem; display: grid; gap: .45rem; }
  .info .k { font: 800 .9375rem/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .info .f { font: 650 2.25rem/1.15 var(--font); }
  .info .n { font: 850 1.625rem/1.1 var(--font-h); letter-spacing: -.01em; }
  .info.cmp .f, .info.cmp .a { font-size: 1.5rem; white-space: nowrap; }
  .legend.cmp { display: none; }
  .info .n:empty { display: none; }
  .info .a { font: 900 2.5rem/1 var(--font); color: var(--accent-text); font-variant-numeric: tabular-nums; }
  .info p { margin: .1rem 0 0; font: 550 1.125rem/1.35 var(--font); color: var(--muted); }
  .info .gone { display: none; }
  .swap { animation: swap .45s ease-out; }
  @keyframes swap { from { opacity: 0; transform: translateY(-.5rem); } to { opacity: 1; transform: none; } }
  .katex { font-family: var(--font) !important; font-size: 1em !important; font-weight: 650; line-height: 1.25; }
  .katex .mathnormal, .katex .mathit { font-family: var(--font); font-style: italic; }
  .katex .mord, .katex .mbin, .katex .mrel, .katex .mop, .katex .mopen, .katex .mclose, .katex .mpunct, .katex .mathrm, .katex .text, .katex .textrm { font-family: var(--font); }
  .hl { color: var(--accent-text); background: var(--hl); border-radius: .4rem; padding: 0 .1em; }

  .legend { position: fixed; left: 2.5rem; bottom: 7.5rem; display: grid; gap: .55rem; pointer-events: none; }
  .legend .it { display: flex; align-items: center; gap: .6rem; font: 650 1.0625rem/1 var(--font); color: var(--muted); }
  .legend .it b { color: var(--fg); font-weight: 800; min-width: 1.1em; }
  .sw { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; box-shadow: inset -.2rem -.25rem .4rem rgba(0,0,0,.3), inset .15rem .15rem .3rem rgba(255,255,255,.5); }
  .legend svg { width: 1.6rem; height: 1.6rem; flex: none; }

  .dock { position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%); display: flex; align-items: center; gap: .35rem; padding: .5rem; border-radius: 999px; }
  .dock .sep { width: .0625rem; align-self: stretch; margin: .5rem .3rem; background: var(--line); }
  .chip {
    min-height: 3.75rem; min-width: 5.25rem; padding: 0 1rem; border: .125rem solid transparent; border-radius: 999px;
    font: 750 1.375rem/1 var(--font); color: var(--fg); background: transparent; cursor: pointer; touch-action: manipulation; transition: background-color .2s, border-color .2s, opacity .3s;
  }
  .chip.on { background: var(--hl); border-color: var(--accent); }
  .chip:active { transform: scale(.96); }
  .chip:focus-visible { outline: .2rem solid var(--fg); outline-offset: .15rem; }
  .mols.locked .chip { opacity: .4; pointer-events: none; }
  .mols { display: flex; gap: .2rem; }
  .chip.small { font-size: 1.125rem; font-weight: 700; padding: 0 1.1rem; white-space: nowrap; }
  .chip svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.3rem; }
  .fallback { position: fixed; inset: 0; display: none; place-content: center; padding: 3rem; text-align: center; font: 600 1.5rem/1.4 var(--font); color: var(--muted); pointer-events: none; }
  .fallback.shown { display: grid; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <div class="halo"></div>
  <div id="view" aria-label="3D molecule. Drag to rotate, pinch to zoom."></div>
  <div class="labels" id="labels"></div>
  <div class="fallback" id="fallback">The 3D view could not load three.js from Rupok's offline libraries (rupoklib).<br>The shapes, angles and steps still work in the panel.</div>

  <div class="top">
    <div>
      <p class="eyebrow">Chemistry · Molecular shapes</p>
      <h1>Molecules in 3D</h1>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <div class="right">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="card info" id="info" aria-live="polite">
        <span class="k" id="i-k"></span>
        <div class="f" id="i-f"></div>
        <span class="n" id="i-n"></span>
        <span class="a" id="i-a"></span>
        <p id="i-p"></p>
      </div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="card dock">
    <div class="mols" id="mols" role="group" aria-label="Molecule"></div>
    <span class="sep"></span>
    <button class="chip small" type="button" id="m-ball" aria-pressed="true">Ball &amp; stick</button>
    <button class="chip small" type="button" id="m-fill" aria-pressed="false">Space-filling</button>
    <span class="sep"></span>
    <button class="chip small" type="button" id="spin" aria-pressed="true" aria-label="Auto-rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
  </div>

<script type="module">
  /* rupok injects window.rupok before this script runs. This small stand-in
     is only used when the file is opened directly in a browser without the SDK,
     so the object still previews (arrow keys step through it). */
  const rupok = window.rupok || (function () {
    let cur = 0, count = 0, saved;
    const subs = [];
    const set = (n) => {
      n = Math.max(0, Math.min(count, n));
      if (n !== cur) { cur = n; subs.forEach((f) => f(cur, { source: "local" })); }
    };
    document.addEventListener("keydown", (e) => {
      const k = e.key, tag = e.target.tagName;
      if (k === "ArrowRight" || k === "PageDown" || (k === " " && tag !== "BUTTON")) { e.preventDefault(); set(cur + 1); }
      if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); set(cur - 1); }
    });
    return {
      mode: "present",
      ready: Promise.resolve({ standalone: true }),
      steps: {
        get current() { return cur; },
        get count() { return count; },
        setCount(n) { count = n; set(cur); },
        onChange(f) { subs.push(f); setTimeout(() => f(cur, { source: "init" })); return () => {}; },
        next() { set(cur + 1); },
        prev() { set(cur - 1); },
        goto: set,
      },
      state: { load: () => saved, save: (v) => { saved = v; } },
      theme: { get: (k, d) => d, all: () => ({}), onChange: () => () => {} },
      quiz: { submit() {} },
      resize() {},
      log() {},
    };
  })();

  const STEPS = 4;
  const DEG = Math.PI / 180;
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* CPK colours (a lighter carbon on dark boards), ball radius and van der Waals radius in angstrom. */
  const EL = {
    H: { name: "Hydrogen", color: "#f1f3f5", dark: "#f1f3f5", ball: 0.27, vdw: 1.1, ink: "#111418" },
    C: { name: "Carbon", color: "#343a40", dark: "#5c6570", ball: 0.4, vdw: 1.7, ink: "#ffffff" },
    N: { name: "Nitrogen", color: "#1c7ed6", dark: "#339af0", ball: 0.38, vdw: 1.55, ink: "#ffffff" },
    O: { name: "Oxygen", color: "#e03131", dark: "#f03e3e", ball: 0.38, vdw: 1.52, ink: "#ffffff" },
  };

  /* ---------------------------------------------------------- geometry */
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  function ring(n, polar, len, phase = 0) {
    return Array.from({ length: n }, (_, i) => { const p = phase + (i * 2 * Math.PI) / n; return mul([Math.sin(polar) * Math.cos(p), Math.cos(polar), Math.sin(polar) * Math.sin(p)], len); });
  }
  function zmat(A, B, C, len, ang, dih) {
    const bc = norm(sub(C, B)), n = norm(cross(sub(B, A), bc)), m = cross(n, bc), a = ang * DEG, d = dih * DEG;
    return add(C, add(add(mul(bc, -len * Math.cos(a)), mul(m, len * Math.sin(a) * Math.cos(d))), mul(n, len * Math.sin(a) * Math.sin(d))));
  }
  function twoPairs(center, b1, b2) {
    const u = norm(sub(b1, center)), w = norm(sub(b2, center)), bis = mul(norm(add(u, w)), -1), n = norm(cross(u, w)), h = 57 * DEG;
    return [norm(add(mul(bis, Math.cos(h)), mul(n, Math.sin(h)))), norm(add(mul(bis, Math.cos(h)), mul(n, -Math.sin(h))))];
  }
  function water() {
    const d = 0.958, h = 52.25 * DEG;
    const atoms = [["O", [0, 0, 0]], ["H", [Math.sin(h) * d, -Math.cos(h) * d, 0]], ["H", [-Math.sin(h) * d, -Math.cos(h) * d, 0]]];
    return { atoms, bonds: [[0, 1, 1], [0, 2, 1]], lps: twoPairs(atoms[0][1], atoms[1][1], atoms[2][1]).map((dir) => [0, dir]), angles: [[1, 0, 2, "104.5°"]] };
  }
  function co2() { return { atoms: [["C", [0, 0, 0]], ["O", [1.16, 0, 0]], ["O", [-1.16, 0, 0]]], bonds: [[0, 1, 2], [0, 2, 2]], lps: [], angles: [[1, 0, 2, "180°"]], plane: [0, 0, 1] }; }
  function methane() {
    const hs = [[0, 1.087, 0], ...ring(3, Math.acos(-1 / 3), 1.087, 30 * DEG)];
    return { atoms: [["C", [0, 0, 0]], ...hs.map((p) => ["H", p])], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1], [0, 4, 1]], lps: [], angles: [[1, 0, 2, "109.5°"]] };
  }
  function ammonia() {
    const c = Math.sqrt((Math.cos(107 * DEG) + 0.5) / 1.5), hs = ring(3, Math.acos(-c), 1.012, 30 * DEG);
    return { atoms: [["N", [0, 0, 0]], ...hs.map((p) => ["H", p])], bonds: [[0, 1, 1], [0, 2, 1], [0, 3, 1]], lps: [[0, [0, 1, 0]]], angles: [[1, 0, 2, "107°"]] };
  }
  function ethanol() {
    const C1 = [0, 0, 0], C2 = [1.53, 0, 0], O = zmat([-0.5, 1, 0], C1, C2, 1.43, 109.5, 0), HO = zmat(C1, C2, O, 0.96, 108.5, 180);
    const hs = [zmat(O, C2, C1, 1.09, 109.5, 180), zmat(O, C2, C1, 1.09, 109.5, 60), zmat(O, C2, C1, 1.09, 109.5, -60), zmat(O, C1, C2, 1.09, 109.5, 120), zmat(O, C1, C2, 1.09, 109.5, -120)];
    const atoms = [["C", C1], ["C", C2], ["O", O], ["H", HO], ...hs.map((p) => ["H", p])];
    return { atoms, bonds: [[0, 1, 1], [1, 2, 1], [2, 3, 1], [0, 4, 1], [0, 5, 1], [0, 6, 1], [1, 7, 1], [1, 8, 1]], lps: twoPairs(O, C2, HO).map((dir) => [2, dir]), angles: [[0, 1, 2, "109.5°"], [1, 2, 3, "108.5°"]] };
  }
  function benzene() {
    const atoms = [], bonds = [];
    for (let i = 0; i < 6; i++) { const a = (i * 60 + 30) * DEG; atoms.push(["C", [Math.cos(a) * 1.39, Math.sin(a) * 1.39, 0]]); }
    for (let i = 0; i < 6; i++) { const a = (i * 60 + 30) * DEG; atoms.push(["H", [Math.cos(a) * 2.48, Math.sin(a) * 2.48, 0]]); }
    for (let i = 0; i < 6; i++) bonds.push([i, (i + 1) % 6, i % 2 ? 1 : 2]);
    for (let i = 0; i < 6; i++) bonds.push([i, i + 6, 1]);
    return { atoms, bonds, lps: [], angles: [[5, 0, 1, "120°"]], plane: [0, 0, 1], aromatic: true };
  }

  const MOLS = [
    { id: "h2o", f: "H₂O", tex: "H_2O", name: "Water", make: water, tilt: [8, 28], shape: "Bent", angle: "104.5°", ax: "AX_2E_2",
      info: "2 bonding pairs + 2 lone pairs on O. The lone pairs push the H atoms closer." },
    { id: "co2", f: "CO₂", tex: "CO_2", name: "Carbon dioxide", make: co2, tilt: [14, 28], shape: "Linear", angle: "180°", ax: "AX_2",
      info: "2 double bonds and no lone pairs on C: they point in opposite directions." },
    { id: "ch4", f: "CH₄", tex: "CH_4", name: "Methane", make: methane, tilt: [18, 22], shape: "Tetrahedral", angle: "109.5°", ax: "AX_4",
      info: "4 bonding pairs spread out as far apart as they can in 3D." },
    { id: "nh3", f: "NH₃", tex: "NH_3", name: "Ammonia", make: ammonia, tilt: [20, 18], shape: "Trigonal pyramidal", angle: "107°", ax: "AX_3E",
      info: "3 bonding pairs + 1 lone pair on N. The lone pair pushes the bonds down." },
    { id: "eth", f: "C₂H₅OH", tex: "C_2H_5OH", name: "Ethanol", make: ethanol, tilt: [20, -18], shape: "Tetrahedral C, bent O", angle: "≈ 109.5°", ax: "AX_4\\;\\cdot\\;AX_2E_2",
      info: "Each carbon is tetrahedral. O has 2 lone pairs, so C–O–H is bent." },
    { id: "c6h6", f: "C₆H₆", tex: "C_6H_6", name: "Benzene", make: benzene, tilt: [-55, 0], shape: "Flat hexagon", angle: "120°", ax: "AX_3",
      info: "Each carbon is trigonal planar. Ring electrons are shared above and below it." },
  ];
  const COMPARE = ["ch4", "nh3", "h2o"];
  const mdef = (id) => MOLS.find((m) => m.id === id);
  function counts(m) { const c = {}; for (const [el] of m.make().atoms) c[el] = (c[el] || 0) + 1; return c; }
  function countWords(m) { return Object.entries(counts(m)).map(([el, n]) => `${n} ${EL[el].name.toLowerCase()}`).join(" + "); }
  const CAPTIONS = (m) => [
    `<b>${m.name}</b> is built from ${countWords(m)}. Count them.`,
    `The atoms <b>fly into place</b>, one by one, in real 3D geometry.`,
    `<b>Bonds</b> form: shared electron pairs hold the atoms together.`,
    `Electron pairs repel, so ${m.f} is <b>${m.shape.toLowerCase()}</b>.`,
    `Same 4 electron pairs, more <b>lone pairs</b>: the bond angle shrinks.`,
  ];

  let molId = "h2o", mode = "ball", step = 0, spin = true;
  const cssVar = (n, fb) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || fb;
  const isDark = () => document.documentElement.getAttribute("data-scheme") === "dark";

  /* ---------------------------------------------------------- panel */
  const TRUST = { throwOnError: false, trust: (c) => c.command === "\\htmlClass", strict: false };
  function tex(el, src, html) {
    if (window.katex) { try { window.katex.render(src, el, TRUST); return; } catch (e) { /* fall back */ } }
    el.innerHTML = html;
  }
  const HL = (s) => `\\htmlClass{hl}{${s}}`;
  for (let i = 0; i <= STEPS; i++) $("dots").appendChild(document.createElement("i"));
  for (const m of MOLS) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.id = m.id; b.textContent = m.f; b.setAttribute("aria-label", m.name);
    b.addEventListener("click", () => { if (step >= 4 || molId === m.id) return; molId = m.id; persist(); rebuild(true); updatePanel(true); });
    $("mols").appendChild(b);
  }
  function updatePanel(swap) {
    const m = mdef(molId);
    document.querySelectorAll("#mols .chip").forEach((b) => { const on = b.dataset.id === molId; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
    $("mols").classList.toggle("locked", step >= 4);
    for (const [id, on] of [["m-ball", mode === "ball"], ["m-fill", mode === "fill"], ["spin", spin]]) { $(id).classList.toggle("on", on); $(id).setAttribute("aria-pressed", String(on)); }
    $("caption").innerHTML = CAPTIONS(m)[step];
    document.querySelectorAll("#dots i").forEach((d, i) => { d.classList.toggle("on", i <= step); d.classList.toggle("now", i === step); });
    const f = $("i-f"), shapeOn = step >= 3;
    if (step >= 4) {
      $("i-k").textContent = "Lone pairs (E) squeeze";
      tex(f, `AX_4 \\to AX_3${HL("E")} \\to AX_2${HL("E_2")}`, "AX₄ → AX₃<span class='hl'>E</span> → AX₂<span class='hl'>E₂</span>");
      $("i-n").textContent = "";
      $("i-a").textContent = "109.5° → 107° → 104.5°";
      $("i-p").textContent = "A lone pair belongs to one atom only, so it spreads out and pushes the bonds closer.";
    } else if (shapeOn) {
      $("i-k").textContent = "VSEPR shape";
      const ax = m.ax.replace(/E(_\d)?/, (e) => HL(e));
      tex(f, ax, m.ax.replace(/_(\d)/g, "<sub>$1</sub>"));

    const wasCompare = step >= 4, prev = step;
    step = s;
    animStep = animate && s === prev + 1 ? s : -1;
    stepAt = performance.now();
    if ((s >= 4) !== wasCompare || !groups.length) rebuild(animate && groups.length > 0);
    else if (s === 0) { quat.copy(home); zoom = 1; }
    fitCamera();
    updatePanel(animate);
    kick();
  }

  rupok.theme.onChange(() => applyTheme());
  rupok.steps.setCount(STEPS);
  updatePanel();
  rupok.ready.then(() => {
    const saved = rupok.state.load();
    if (saved && typeof saved === "object") {
      if (MOLS.some((m) => m.id === saved.mol)) molId = saved.mol;
      if (saved.mode === "ball" || saved.mode === "fill") { mode = saved.mode; prevMode = mode; }
    }
    updatePanel();
    rupok.steps.onChange(renderStep);
  });
</script>
</body>
</html>
