<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projectile motion</title>
<!--
  rupok Smart Object: Physics, projectile motion (kinematics, Grade 9-11).
  Size 1920 x 1080 (full slide), 4 steps:
    0      aim: drag the launch arrow (direction = angle, length = speed)
    1      launch: a parabola with a fading trail and particle puffs
    2      split the velocity: ghosts at equal time steps, live vx / vy arrows
    3      the range equation: 30, 45 and 60 degrees launched together
    4      the same launch on Earth, Moon, Mars and Jupiter
  Each step has one caption line and a LaTeX equation (typeset by the SDK
  with KaTeX) that highlights the term that changes; labels on the scene are
  LaTeX too and keep clear of the cards and the dock. Light and dark (chalkboard) schemes. Angle, speed and
  planet are saved with the lesson.
-->
<style>
  :root {
    --bg: var(--rupok-color-bg, #ffffff);
    --fg: var(--rupok-color-fg, #111418);
    --muted: var(--rupok-color-muted, #5f6670);
    --surface: var(--rupok-color-surface, #f4f5f4);
    --line: var(--rupok-color-line, rgba(17, 20, 24, 0.12));
    --accent: var(--rupok-color-accent, #0ca678);
    /* accent text (4.5:1 on the page), text on accent fills, highlight background */
    --accent-text: var(--rupok-color-accent-text, #087f5b);
    --on-accent: var(--rupok-color-on-accent, #04241b);
    --accent-soft: var(--rupok-color-accent-soft, #e6fcf5);
    --font: var(--rupok-font-body, "Inter Variable", Inter, "Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --font-h: var(--rupok-font-heading, var(--font));
    --sky: #1c7ed6; --coral: #f0533c; --sun: #f59f00; --mint: #0ca678;
    --glass: color-mix(in srgb, var(--bg) 90%, transparent);
    --shadow: 0 .75rem 2.5rem rgba(17, 20, 24, .14), 0 .125rem .375rem rgba(17, 20, 24, .08);
    --hl: var(--accent-soft);
  }
  :root[data-scheme="dark"] {
    --sky: #74c0fc; --coral: #ff8a7a; --sun: #ffd43b; --mint: #38d9a9;
    --glass: color-mix(in srgb, var(--bg) 86%, transparent);
    --shadow: 0 .75rem 2.5rem rgba(0, 0, 0, .45), 0 .125rem .375rem rgba(0, 0, 0, .3);
  }
  /* Designed at 1280 x 720: 1rem = 16px there (24px on a 1920 slide). */
  html { font-size: min(calc(100vw * 16 / 1280), calc(100vh * 16 / 720)); }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .top { position: fixed; left: 2.5rem; top: 2rem; right: 2.5rem; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .eyebrow { margin: 0 0 .4rem; font: 800 1rem/1 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
  h1 { margin: 0; font: 900 3.25rem/1 var(--font-h); letter-spacing: -.035em; }
  .caption { margin: .75rem 0 0; max-width: 44rem; font: 500 1.625rem/1.3 var(--font); color: var(--muted); }
  .caption b { color: var(--fg); font-weight: 750; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 1rem; }
  .dots { display: flex; gap: .5rem; padding: .25rem 0; }
  .dots i { width: .75rem; height: .75rem; border-radius: 50%; background: var(--line); transition: background-color .3s, transform .3s; }
  .dots i.on { background: var(--accent); }
  .dots i.now { transform: scale(1.4); }

  .eq {
    min-width: 22rem; padding: 1rem 1.375rem 1.125rem; display: grid; gap: .55rem; justify-items: start;
    background: linear-gradient(var(--surface), var(--surface)), var(--glass); 
    border: .0625rem solid var(--line); border-radius: 1.25rem; box-shadow: var(--shadow);
    font: 600 1.75rem/1.2 var(--font); color: var(--fg);
  }
  .eq .k { font: 800 .9375rem/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .eq .line { font-size: 1.55rem; min-height: 1.4em; }
  .eq .vals { font: 600 1.25rem/1.25 var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
  .eq .vals b { color: var(--fg); font-weight: 750; }
  .eq.swap { animation: swap .45s ease-out; }
  @keyframes swap { from { opacity: 0; transform: translateY(-.5rem); } to { opacity: 1; transform: none; } }
  /* Floating labels on the scene, typeset with LaTeX (tag()). */
  .tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; padding: .32rem .7rem; border-radius: 999px; white-space: nowrap; font: 650 1.15rem/1.15 var(--font); color: var(--fg); background: color-mix(in srgb, var(--bg) 90%, transparent); border: .1rem solid var(--line); will-change: transform; }
  .tag.bare { padding: 0 .1rem; background: none; border: 0; border-radius: 0; text-shadow: 0 0 .2em var(--bg), 0 0 .2em var(--bg), 0 0 .08em var(--bg); }
  /* Plain-HTML stand-in for maths until KaTeX has loaded. */
  .tx { font-style: normal; }
  .nw { white-space: nowrap; }
  .tx sub, .tx sup { font-size: .68em; }
  .hl { color: var(--accent-text); background: var(--hl); border-radius: .4rem; padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .fx i { font-style: italic; }
  .fx .fr { display: inline-grid; vertical-align: middle; text-align: center; margin: 0 .15em; }
  .fx .fr > span:first-child { border-bottom: .09rem solid currentColor; padding: 0 .2em; }

  .dock {
    position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
    display: flex; align-items: center; gap: .5rem; padding: .5rem;
    background: linear-gradient(var(--surface), var(--surface)), var(--glass); 
    border: .0625rem solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  }
  .dock .sep { width: .0625rem; align-self: stretch; margin: .5rem .25rem; background: var(--line); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .6rem; min-height: 4rem; padding: 0 1.75rem;
    border: 0; border-radius: 999px; font: 800 1.375rem/1 var(--font); color: var(--on-accent); background: var(--accent);
    cursor: pointer; touch-action: manipulation; box-shadow: 0 .25rem .75rem color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .btn svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .btn:active, .chip:active { transform: scale(.96); }
  .btn:focus-visible, .chip:focus-visible { outline: .2rem solid var(--fg); outline-offset: .15rem; }
  .chip {
    display: inline-flex; align-items: center; gap: .55rem; min-height: 4rem; padding: 0 1.1rem 0 .7rem;
    border: .125rem solid transparent; border-radius: 999px; background: transparent; color: var(--fg);
    font: 700 1.1875rem/1 var(--font); cursor: pointer; touch-action: manipulation; transition: background-color .2s, border-color .2s, opacity .3s;
  }
  .chip small { font: 600 1rem/1 var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip .orb { width: 2rem; height: 2rem; border-radius: 50%; flex: none; box-shadow: inset -.3rem -.3rem .5rem rgba(0,0,0,.28), inset .2rem .2rem .4rem rgba(255,255,255,.35); }
  .chip.on { background: var(--hl); border-color: var(--accent); }
  .chips.locked .chip { opacity: .4; pointer-events: none; }
  .chips { display: flex; gap: .25rem; }
  .ghost { color: var(--fg); background: transparent; box-shadow: none; padding: 0 1.25rem; border: .125rem solid var(--line); }
  .ghost svg { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
  <canvas id="cv" aria-label="Launcher and trajectory. Drag the arrow to aim."></canvas>

  <div class="top">
    <div data-avoid>
      <p class="eyebrow">Physics · Kinematics</p>
      <h1>Projectile motion</h1>
      <p class="caption" id="caption" aria-live="polite"></p>
    </div>
    <div class="right">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="eq" id="eq" aria-live="polite" data-avoid></div>
    </div>
  </div>

  <div class="dock" data-avoid>
    <button class="btn" id="launch" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Launch</button>
    <span class="sep"></span>
    <div class="chips" id="planets" role="group" aria-label="Planet"></div>
    <span class="sep"></span>
    <button class="btn ghost" id="clear" type="button" aria-label="Clear old paths"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg></button>
  </div>

<script>
  /* rupok injects window.rupok before this script runs. This small stand-in
     is only used when the file is opened directly in a browser without the SDK,
     so the object still previews (arrow keys step through it). */
  const rupok = window.rupok || (function () {
    let cur = 0, count = 0, saved;
    const subs = [];
    const set = (n) => {
      n = Math.max(0, Math.min(count, n));
      if (n !== cur) { cur = n; subs.forEach((f) => f(cur, { source: "local" })); }
    };
    document.addEventListener("keydown", (e) => {
      const k = e.key, tag = e.target.tagName;
      if (k === "ArrowRight" || k === "PageDown" || (k === " " && tag !== "BUTTON")) { e.preventDefault(); set(cur + 1); }
      if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); set(cur - 1); }
    });
    return {
      mode: "present",
      ready: Promise.resolve({ standalone: true }),
      steps: {
        get current() { return cur; },
        get count() { return count; },
        setCount(n) { count = n; set(cur); },
        onChange(f) { subs.push(f); setTimeout(() => f(cur, { source: "init" })); return () => {}; },
        next() { set(cur + 1); },
        prev() { set(cur - 1); },
        goto: set,
      },
      state: { load: () => saved, save: (v) => { saved = v; } },
      theme: { get: (k, d) => d, all: () => ({}), onChange: () => () => {} },
      quiz: { submit() {} },
      resize() {},
      log() {},
    };
  })();

  const STEPS = 4;
  const DEG = Math.PI / 180;
  const PLANETS = [
    { id: "earth", name: "Earth", g: 9.8, color: "#1c7ed6", sky: "#4dabf7", land: "#37b24d", hills: "#2f9e44" },
    { id: "moon", name: "Moon", g: 1.6, color: "#868e96", sky: "#5c677a", land: "#adb5bd", hills: "#868e96", craters: true },
    { id: "mars", name: "Mars", g: 3.7, color: "#e8590c", sky: "#ff922b", land: "#e8590c", hills: "#d9480f" },
    { id: "jupiter", name: "Jupiter", g: 24.8, color: "#d9a03f", sky: "#fab005", land: "#f08c00", hills: "#e67700", bands: true },
  ];
  const CAPTIONS = [
    "<b>Drag the arrow</b> to aim. Its direction is the angle, its length the speed.",
    "Launch! <b>Gravity</b> pulls the ball down all the time: the path is a parabola.",
    "Ghosts at equal times: <b>equal steps sideways</b> ($v_x$ is constant), uneven steps up and down.",
    "<b>$30^\\circ$ and $60^\\circ$</b> land in the same place. <b>$45^\\circ$</b> flies farthest.",
    "Same launch, four worlds: <b>weaker gravity $g$</b>, longer and higher flight.",
  ];

  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");

  /* ---------------------------------------------------------- LaTeX
     Maths is typeset by the SDK (rupok.tex / data-tex, KaTeX from rupoklib).
     Until KaTeX has loaded, or when this file is opened without Rupok, a
     plain-HTML approximation stands in. */
  const TEX_SYM = { theta: "θ", pi: "π", times: "×", cdot: "·", Delta: "Δ", Omega: "Ω", to: "→", longrightarrow: "→", circ: "°", approx: "≈", quad: " ", ",": " ", ";": " ", ":": " ", "!": "", sin: "sin ", cos: "cos ", tan: "tan " };
  function texHtml(t) {
    let s = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    for (let i = 0; i < 2; i++) s = s.replace(/\\hl\{([^{}]*(?:\{[^{}]*\}[^{}]*)*)\}/g, '<span class="hl">$1</span>');
    s = s.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, "$1/$2").replace(/\\(?:mathrm|text|mathit|operatorname)\{([^{}]*)\}/g, "$1");
    s = s.replace(/\\([A-Za-z]+|[,;:!])/g, (m, w) => TEX_SYM[w] ?? "");
    s = s.replace(/\^\{([^{}]*)\}|\^(\S)/g, (m, a, b) => `<sup>${a ?? b}</sup>`).replace(/_\{([^{}]*)\}|_(\S)/g, (m, a, b) => `<sub>${a ?? b}</sub>`);
    return `<span class="tx">${s.replace(/[{}]/g, "").replace(/(^|[^a-z"])-/g, "$1−")}</span>`;
  }
  /* Typeset `src` into `el`; cheap to call again with the same formula. */
  function tex(el, src, display) {
    if (!el.querySelector(".katex")) el.innerHTML = texHtml(src);
    if (rupok.tex) rupok.tex(el, src, { display: !!display });
  }
  /* Rich text with $…$ formulas (captions): each becomes a [data-tex] span the SDK typesets. */
  function rich(el, html) {
    /* punctuation right after a formula stays on its line */
    el.innerHTML = html.replace(/\$([^$]+)\$([.,;:!?)]*)/g, (m, t, p) =>
      `<span class="nw"><span data-tex="${t.replace(/&/g, "&amp;").replace(/"/g, "&quot;")}">${texHtml(t)}</span>${p}</span>`);
    if (rupok.math) rupok.math.render(el);
  }

  /* ---------------------------------------------------------- floating labels
     Labels on the scene are HTML typeset with LaTeX, placed every frame so they
     never cover the cards, the dock ([data-avoid]) or each other: a label tries
     its preferred side, flips, then clamps inside the frame. */
  const tagLayer = document.createElement("div");
  tagLayer.className = "tags";
  tagLayer.setAttribute("aria-hidden", "true");
  cv.after(tagLayer);
  /* labels that sit inside a card (opts.over) go above the cards */
  const tagOver = tagLayer.cloneNode();
  document.body.appendChild(tagOver);
  const tagMap = new Map();
  const TAG_FLIP = { right: ["left"], left: ["right"], above: ["below"], below: ["above"], "above-right": ["above-left", "below-right"], "above-left": ["above-right", "below-left"], "below-right": ["below-left", "above-right"], "below-left": ["below-right", "above-left"] };
  let tagGen = 0, tagAvoid = [], tagUsed = [];
  function tagsBegin() {
    tagGen++; tagUsed = [];
    tagAvoid = [...document.querySelectorAll("[data-avoid]")].map((e) => e.getBoundingClientRect()).filter((r) => r.width > 0).map((r) => ({ l: r.left, t: r.top, r: r.right, b: r.bottom }));
  }
  function tagsEnd() { for (const t of tagMap.values()) if (t.gen !== tagGen && t.on) { t.on = false; t.el.style.display = "none"; } }
  function overlap(a, b) { const w = Math.min(a.r, b.r) - Math.max(a.l, b.l), h = Math.min(a.b, b.b) - Math.max(a.t, b.t); return w > 0 && h > 0 ? w * h : 0; }
  function tag(key, x, y, src, color, opts = {}) {
    let t = tagMap.get(key);
    if (!t) { const el = document.createElement("div"); (opts.over ? tagOver : tagLayer).appendChild(el); t = { el, on: true }; tagMap.set(key, t); }
    t.gen = tagGen;
    const cls = (opts.bare ? "tag bare" : "tag") + (opts.cls ? " " + opts.cls : "");
    if (t.cls !== cls) { t.cls = cls; t.el.className = cls; t.w = 0; }
    const size = opts.size || 1.15;
    if (t.size !== size) { t.size = size; t.el.style.fontSize = size + "rem"; t.w = 0; }
    if (t.color !== color) { t.color = color; t.el.style.borderColor = color || ""; }
    const ink = opts.ink || "";
    if (t.ink !== ink) { t.ink = ink; t.el.style.color = ink; }
    if (!t.on) { t.on = true; t.el.style.display = ""; }
    if (t.src !== src) { t.src = src; tex(t.el, src); t.w = 0; }
    const k = !!t.el.querySelector(".katex");
    if (!t.w || k !== t.k) { t.k = k; t.w = t.el.offsetWidth; t.h = t.el.offsetHeight; }
    const w = t.w, h = t.h, g = opts.gap ?? 0.55 * R, m = 0.4 * R, d = g * 0.7;
    const spots = { center: [x - w / 2, y - h / 2], right: [x + g, y - h / 2], left: [x - g - w, y - h / 2], above: [x - w / 2, y - g - h], below: [x - w / 2, y + g],
      "above-right": [x + d, y - d - h], "above-left": [x - d - w, y - d - h], "below-right": [x + d, y + d], "below-left": [x - d - w, y + d] };
    const at = opts.at || "center";
    const order = opts.fixed ? [at] : [at, ...(TAG_FLIP[at] || []), "above", "below", "above-right", "above-left", "below-right", "below-left", "right", "left"];
    let best = null, cost = Infinity;
    for (const a of order) {
      const lx = Math.max(m, Math.min(W - w - m, spots[a][0])), ly = Math.max(m, Math.min(H - h - m, spots[a][1]));
      if (opts.fixed) { best = [lx, ly]; break; }
      const box = { l: lx - 4, t: ly - 4, r: lx + w + 4, b: ly + h + 4 };
      let c = 0;
      for (const o of tagAvoid) c += overlap(box, o) * 4;
      for (const o of tagUsed) c += overlap(box, o);
      if (c < cost) { cost = c; best = [lx, ly]; }
      if (c === 0) break;
    }
    tagUsed.push({ l: best[0], t: best[1], r: best[0] + w, b: best[1] + h });
    t.el.style.transform = `translate(${Math.round(best[0])}px, ${Math.round(best[1])}px)`;
    return best;
  }

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let angle = 45, speed = 20, planet = "earth";
  let step = 0;
  let flight = null;        /* { k, angle, speed, t0, pf, done } */
  let trio = null;          /* step 3: 30/45/60 together */
  let compare = null;       /* step 4: all planets together */
  let ghosts = [];          /* earlier launches, drawn faint */
  let particles = [];
  let drag = null;
  let W = 0, H = 0, R = 16, raf = 0, lastT = 0;
  let span = 50, spanFrom = 50, spanTo = 50, spanAt = -1e9;
  let C = {};

  /* ---------------------------------------------------------- colour */
  const pc = document.createElement("canvas").getContext("2d");
  function rgba(c) {
    pc.fillStyle = "#000"; pc.fillStyle = c; const s = pc.fillStyle;
    if (s[0] === "#") return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16), 1];
    const m = s.match(/[\d.]+/g) || [0, 0, 0, 1];
    return [+m[0], +m[1], +m[2], m[3] === undefined ? 1 : +m[3]];
  }
  function mix(a, b, t, alpha = 1) {
    const x = rgba(a), y = rgba(b);
    const m = (i) => Math.round(x[i] + (y[i] - x[i]) * t);
    return `rgba(${m(0)}, ${m(1)}, ${m(2)}, ${alpha})`;
  }
  function readTheme() {
    const s = getComputedStyle(document.documentElement);
    const v = (n, fb) => s.getPropertyValue(n).trim() || fb;
    C = {
      bg: v("--bg", "#ffffff"), fg: v("--fg", "#111418"), muted: v("--muted", "#5f6670"), line: v("--line", "rgba(17,20,24,.12)"),
      accent: v("--accent", "#0ca678"), accentText: v("--accent-text", "#087f5b"), sky: v("--sky", "#1c7ed6"), coral: v("--coral", "#f0533c"), sun: v("--sun", "#f59f00"),
      font: v("--font", "system-ui, sans-serif"),
      dark: document.documentElement.getAttribute("data-scheme") === "dark",
    };
    const L = rgba(C.bg); C.dark = C.dark || (0.2126 * L[0] + 0.7152 * L[1] + 0.0722 * L[2]) / 255 < 0.45;
  }

  /* ---------------------------------------------------------- physics */
  const P = () => PLANETS.find((p) => p.id === planet);
  function kin(a, v, g) {
    const s = Math.sin(a * DEG), c = Math.cos(a * DEG);
    return { a, v, g, vx: v * c, vy: v * s, T: (2 * v * s) / g, R: (v * v * Math.sin(2 * a * DEG)) / g, Hm: (v * s) ** 2 / (2 * g) };
  }
  const posAt = (k, t) => [k.vx * t, Math.max(0, k.vy * t - 0.5 * k.g * t * t)];
  const fmt = (v, d = 1) => (Math.abs(v) < 0.05 && d === 1 ? 0 : v).toFixed(d);
  const fmtLen = (v) => (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + " m";
  const texLen = (v) => (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + "\\,\\text{m}";

  /* ---------------------------------------------------------- frame */
  const NICE = [10, 15, 20, 25, 30, 40, 50, 60, 80, 100, 120, 150, 200, 250, 300, 400, 500, 600, 800, 1000, 1200, 1500, 2000];
  function layout() {
    const left = 7.5 * R, right = 4 * R, top = 13 * R, ground = H - 8.25 * R;
    return { left, right, top, ground, pw: W - left - right, ph: ground - top };
  }
  function wantSpan(list) {
    const L = layout();
    let nx = 1, ny = 1;
    for (const k of list) { nx = Math.max(nx, k.R * 1.04); ny = Math.max(ny, k.Hm * 1.08); }
    for (const n of NICE) if (n >= nx && (n * L.ph) / L.pw >= ny) return n;
    return NICE[NICE.length - 1];
  }
  function setSpan(n, animate = true) {
    if (n === spanTo) return;
    spanFrom = span; spanTo = n; spanAt = animate && !reduced ? performance.now() : -1e9;
  }
  function frame() {
    const L = layout();
    const s = L.pw / span;
    return { ...L, s, X: (x) => L.left + x * s, Y: (y) => L.ground - y * s };
  }

  /* ---------------------------------------------------------- drawing helpers */
  const font = (w, size) => `${w} ${size * R}px ${C.font}`;
  function pill(text, x, y, color, opts = {}) {
    ctx.font = font(opts.weight || 750, opts.size || 1.125);
    const w = ctx.measureText(text).width + 1.1 * R, h = (opts.size || 1.125) * R * 1.75;
    const ax = opts.align === "left" ? x : opts.align === "right" ? x - w : x - w / 2;
    ctx.fillStyle = mix(C.bg, C.bg, 0, 0.88); ctx.strokeStyle = color; ctx.lineWidth = 0.1 * R;
    ctx.beginPath(); ctx.roundRect(ax, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = opts.ink || C.fg; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(text, ax + w / 2, y + 0.05 * R);
  }
  function text(str, x, y, color, size = 1, align = "center", weight = 650) {
    ctx.font = font(weight, size); ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function arrow(x0, y0, x1, y1, color, w) {
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
    if (len < 3) return;
    const ux = dx / len, uy = dy / len, hd = Math.min(len * 0.55, 0.95 * R);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * hd * 0.7, y1 - uy * hd * 0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1);
    ctx.lineTo(x1 - ux * hd - uy * hd * 0.55, y1 - uy * hd + ux * hd * 0.55);
    ctx.lineTo(x1 - ux * hd + uy * hd * 0.55, y1 - uy * hd - ux * hd * 0.55);
    ctx.closePath(); ctx.fill();
  }
  function ball(x, y, color, alpha = 1, r = 0.7, glow = false) {
    ctx.save(); ctx.globalAlpha = alpha;
    if (glow && C.dark) { ctx.shadowColor = color; ctx.shadowBlur = 1.2 * R; }
    const g = ctx.createRadialGradient(x - r * R * 0.35, y - r * R * 0.4, r * R * 0.1, x, y, r * R);
    g.addColorStop(0, mix(color, "#ffffff", 0.75)); g.addColorStop(0.45, color); g.addColorStop(1, mix(color, "#000000", 0.25));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function seeded(n) { let s = n; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }

  /* ---------------------------------------------------------- scenery */
  function scenery(f, pl, neutral) {
    const hue = neutral ? C.muted : pl.sky;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    const sky = ctx.createLinearGradient(0, 0, 0, f.ground);
    sky.addColorStop(0, mix(C.bg, hue, C.dark ? 0.2 : 0.16));
    sky.addColorStop(1, mix(C.bg, hue, 0.02));
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, f.ground);
    if (C.dark && !neutral) {
      const rnd = seeded(7);
      ctx.fillStyle = mix(C.bg, "#ffffff", 0.7, 0.5);
      for (let i = 0; i < 70; i++) {
        const x = rnd() * W, y = rnd() * f.ground * 0.75, r = (rnd() * 0.09 + 0.04) * R;
        ctx.globalAlpha = pl.id === "moon" ? 0.9 : 0.45; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (pl.bands && !neutral) {
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = mix(C.bg, pl.hills, C.dark ? 0.09 : 0.07);
        const y = f.ground * (0.22 + i * 0.13);
        ctx.beginPath(); ctx.moveTo(0, y);
        for (let x = 0; x <= W; x += W / 24) ctx.lineTo(x, y + Math.sin(x / W * 9 + i * 2) * 0.6 * R);
        ctx.lineTo(W, y + 2.2 * R); ctx.lineTo(0, y + 2.2 * R); ctx.fill();
      }
    }
    /* two parallax hill layers: they shift a little when the zoom changes */
    const z = Math.log(span);
    const hillHue = neutral ? C.muted : pl.hills;
    [[0.06, 0.32, 5.5, 0.18, 11], [0.11, 0.2, 3.6, 0.42, 23]].forEach(([k, amp, freq, par, seed]) => {
      const rnd = seeded(seed + pl.id.length * 13);
      const ph = [rnd() * 6, rnd() * 6, rnd() * 6];
      const off = z * par * 4 * R;
      ctx.fillStyle = mix(C.bg, hillHue, C.dark ? k * 1.5 : k);
      ctx.beginPath(); ctx.moveTo(0, f.ground);
      for (let x = 0; x <= W + 1; x += 6) {
        const u = (x + off) / W;
        const y = f.ground - (amp * f.ph * 0.5) * (0.55 + 0.25 * Math.sin(u * freq + ph[0]) + 0.15 * Math.sin(u * freq * 2.3 + ph[1]) + 0.05 * Math.sin(u * freq * 5.1 + ph[2]));
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, f.ground); ctx.fill();
    });
    /* ground */
    const land = neutral ? C.muted : pl.land;
    ctx.fillStyle = mix(C.bg, land, C.dark ? 0.2 : 0.14); ctx.fillRect(0, f.ground, W, H - f.ground);
    ctx.fillStyle = mix(C.bg, land, C.dark ? 0.65 : 0.55); ctx.fillRect(0, f.ground - 0.12 * R, W, 0.3 * R);
    if (pl.craters && !neutral) {
      const rnd = seeded(3);
      ctx.fillStyle = mix(C.bg, land, C.dark ? 0.3 : 0.24);
      for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.ellipse(rnd() * W, f.ground + (0.8 + rnd() * 6) * R, (0.5 + rnd()) * R, (0.18 + rnd() * 0.2) * R, 0, 0, Math.PI * 2); ctx.fill(); }
    }
    /* distance tape on the ground, height guides in the sky */
    const tick = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500].find((t) => span / t <= 10) || 500;
    ctx.strokeStyle = mix(C.bg, C.fg, 0.45); ctx.lineWidth = 0.1 * R;
    for (let x = 0; x <= span + 1e-6; x += tick) {
      const sx = f.X(x);
      ctx.beginPath(); ctx.moveTo(sx, f.ground + 0.2 * R); ctx.lineTo(sx, f.ground + 0.7 * R); ctx.stroke();
      text(x + (x + tick > span + 1e-6 ? " m" : ""), sx, f.ground + 1.45 * R, mix(C.bg, C.fg, 0.7), 1, "center", 650);
    }
    ctx.save(); ctx.setLineDash([0.3 * R, 0.6 * R]); ctx.strokeStyle = C.line; ctx.lineWidth = 0.08 * R;
    for (let y = tick; f.Y(y) > f.top - 2 * R; y += tick) {
      ctx.beginPath(); ctx.moveTo(f.left - 2.5 * R, f.Y(y)); ctx.lineTo(W - f.right, f.Y(y)); ctx.stroke();
      text(y + " m", f.left - 2.9 * R, f.Y(y), C.muted, 1, "right", 600);
    }
    ctx.restore();
  }

  function cannon(f, a, scale = 1) {
    const x = f.X(0), y = f.ground;
    const metal = C.dark ? "#d5dae1" : "#2b3038", dim = C.dark ? "#9aa3ad" : "#495057";
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.save(); ctx.rotate(-a * DEG);
    const g = ctx.createLinearGradient(0, -0.85 * R, 0, 0.85 * R);
    g.addColorStop(0, mix(metal, "#ffffff", 0.25)); g.addColorStop(0.5, metal); g.addColorStop(1, mix(metal, "#000000", 0.3));
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(-0.9 * R, -0.85 * R, 4.6 * R, 1.7 * R, 0.6 * R); ctx.fill();
    ctx.fillStyle = C.accent; ctx.beginPath(); ctx.roundRect(3.1 * R, -0.95 * R, 0.6 * R, 1.9 * R, 0.25 * R); ctx.fill();
    ctx.restore();
    ctx.fillStyle = dim; ctx.beginPath(); ctx.arc(0, 0, 1.55 * R, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = metal; ctx.lineWidth = 0.32 * R; ctx.beginPath(); ctx.arc(0, -0.15 * R, 1.05 * R, 0, Math.PI * 2); ctx.stroke();
    for (let i = 0; i < 6; i++) { const t = i * Math.PI / 3; ctx.beginPath(); ctx.moveTo(0, -0.15 * R); ctx.lineTo(Math.cos(t) * R, -0.15 * R + Math.sin(t) * R); ctx.lineWidth = 0.12 * R; ctx.stroke(); }
    ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(0, -0.15 * R, 0.32 * R, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* the launch arrow: direction = angle, length = speed; its tip is a drag handle */
  const K_ARROW = 0.3;
  function aimTip(f) {
    const len = speed * K_ARROW * R + 3.7 * R;
    return [f.X(0) + Math.cos(angle * DEG) * len, f.ground - Math.sin(angle * DEG) * len];
  }
  function aim(f, now, full) {
    const x0 = f.X(0), y0 = f.ground;
    const mx = x0 + Math.cos(angle * DEG) * 3.7 * R, my = y0 - Math.sin(angle * DEG) * 3.7 * R;
    const [tx, ty] = aimTip(f);
    ctx.save();
    ctx.strokeStyle = C.muted; ctx.lineWidth = 0.1 * R; ctx.setLineDash([0.35 * R, 0.35 * R]);
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + 7.5 * R, y0); ctx.stroke();
    ctx.beginPath(); ctx.arc(x0, y0, 5.6 * R, -angle * DEG, 0); ctx.stroke();
    ctx.restore();
    if (full) tag("theta", x0 + 7.6 * R * Math.cos(angle * DEG / 2), y0 - 7.6 * R * Math.sin(angle * DEG / 2), `\\theta = ${angle}^\\circ`, "transparent", { fixed: true, size: 1.25 });
    arrow(mx, my, tx, ty, C.accent, 0.42 * R);
    /* handle with a gentle pulse until the first drag */
    const pulse = step === 0 && full && !drag && !reduced ? (Math.sin(now / 380) + 1) / 2 : 0;
    ctx.fillStyle = mix(C.bg, C.accent, 0.2, 0.9); ctx.beginPath(); ctx.arc(tx, ty, (1.45 + pulse * 0.35) * R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.accent; ctx.lineWidth = 0.22 * R; ctx.beginPath(); ctx.arc(tx, ty, 1.1 * R, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(tx, ty, 0.42 * R, 0, Math.PI * 2); ctx.fill();
    const lx = tx + Math.cos(angle * DEG) * 1.8 * R + 1.2 * R, ly = ty - Math.sin(angle * DEG) * 1.8 * R;
    if (full) tag("v", lx - 1.2 * R, ly, `v = ${speed}\\,\\text{m/s}`, C.accent, { at: "right", size: 1.25 });
    return pulse > 0;
  }

  function trail(f, k, t, color, width, ghostsN) {
    const n = 90;
    ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
    let px, py;
    for (let i = 0; i <= n; i++) {
      const ti = (t * i) / n, [x, y] = posAt(k, ti), sx = f.X(x), sy = f.Y(y);
      if (i) { ctx.strokeStyle = color; ctx.globalAlpha = 0.25 + 0.75 * (i / n); ctx.lineWidth = width * (0.55 + 0.45 * i / n); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy); ctx.stroke(); }
      px = sx; py = sy;
    }
    ctx.restore();
    if (ghostsN) {
      const dt = k.T / ghostsN;
      ctx.save(); ctx.setLineDash([0.2 * R, 0.4 * R]); ctx.strokeStyle = mix(C.bg, C.sky, 0.7); ctx.lineWidth = 0.1 * R;
      for (let i = 1; i < ghostsN && i * dt <= t; i++) { const [x, y] = posAt(k, i * dt); ctx.beginPath(); ctx.moveTo(f.X(x), f.Y(y)); ctx.lineTo(f.X(x), f.ground); ctx.stroke(); }
      ctx.restore();
      for (let i = 1; i < ghostsN && i * dt <= t; i++) {
        const [x, y] = posAt(k, i * dt), age = (t - i * dt) / k.T;
        ctx.save(); ctx.globalAlpha = 0.9 - age * 0.45;
        ctx.fillStyle = mix(C.bg, C.sun, 0.25); ctx.strokeStyle = C.sun; ctx.lineWidth = 0.14 * R;
        ctx.beginPath(); ctx.arc(f.X(x), f.Y(y), 0.55 * R, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        ctx.fillStyle = mix(C.bg, C.sky, 0.8); ctx.beginPath(); ctx.arc(f.X(x), f.ground, 0.22 * R, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function vectors(f, k, t, labels) {
    const [x, y] = posAt(k, t), sx = f.X(x), sy = f.Y(y);
    const vx = k.vx, vy = k.vy - k.g * t, s = 0.27 * R, w = 0.3 * R;
    arrow(sx, sy, sx + vx * s, sy, C.sky, w);
    if (Math.abs(vy) > 0.15) arrow(sx, sy, sx, sy - vy * s, C.coral, w);
    arrow(sx, sy, sx + vx * s, sy - vy * s, C.accent, w * 0.7);
    if (!labels) return;
    tag("vx", sx + vx * s, sy, `v_x = ${fmt(vx)}\\,\\text{m/s}`, C.sky, { at: vy > 0 ? "below-right" : "above-right" });
    if (Math.abs(vy) > 0.15) tag("vy", sx, sy - (vy * s) / 2, `v_y = ${fmt(vy)}\\,\\text{m/s}`, C.coral, { at: "left" });
    else tag("vy", sx, sy - 0.6 * R, "v_y = 0", C.coral, { at: "above" });
  }

  function markers(f, k) {
    const ax = f.X(k.vx * k.T / 2), ay = f.Y(k.Hm);
    ctx.save(); ctx.setLineDash([0.4 * R, 0.4 * R]); ctx.strokeStyle = mix(C.bg, C.fg, 0.55); ctx.lineWidth = 0.1 * R;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax, f.ground); ctx.stroke(); ctx.restore();
    tag("H", ax, (ay + f.ground) / 2, `H = ${texLen(k.Hm)}`, mix(C.bg, C.fg, 0.4), { at: "right", gap: 0.4 * R });

    const x0 = f.X(0), x1 = f.X(k.R);

    tag("R", x1, f.ground - 0.4 * R, `R = ${texLen(k.R)}`, C.sun, { at: "above-right" });
  }

  /* ---------------------------------------------------------- particles */
  function puff(x, y, dir, color, n, spread, power) {
    if (reduced) return;
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - 0.5) * spread, v = (0.4 + Math.random()) * power * R;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, r: (0.25 + Math.random() * 0.45) * R, life: 0, max: 0.6 + Math.random() * 0.6, color });
    }
  }
  function stepParticles(dt) {
    for (const p of particles) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 9 * R * dt * 0.5; p.vx *= 0.96; p.vy *= 0.96; }
    particles = particles.filter((p) => p.life < p.max);
  }
  function drawParticles() {
    for (const p of particles) {
      const u = p.life / p.max;
      ctx.globalAlpha = (1 - u) * 0.7; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + u * 1.6), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------------------------------------------------------- main draw */
  function elapsed(run) { return run ? ((performance.now() - run.t0) / 1000) * run.pf : 0; }

  function draw(now) {
    if (!W) return false;
    let busy = false;
    const u = Math.min(1, (now - spanAt) / 650);
    span = spanFrom + (spanTo - spanFrom) * (1 - Math.pow(1 - u, 3));
    if (u < 1) busy = true;
    const f = frame(), pl = P();
    tagsBegin();
    scenery(f, pl, step >= 4);

    if (step >= 4 && compare) {
      const tt = elapsed(compare);
      const sorted = PLANETS.map((p) => ({ p, k: kin(angle, speed, p.g) })).sort((a, b) => b.k.R - a.k.R);
      for (const { p, k } of sorted) {
        const t = Math.min(k.T, tt);
        trail(f, k, t, p.color, 0.3 * R, 0);
        if (t < k.T) busy = true;
      }
      cannon(f, angle, 0.8);
      const boxes = [{ x0: f.X(0) - 2 * R, x1: f.X(0) + 3.5 * R, y0: f.ground - 4 * R, y1: f.ground }];
      for (const { p, k } of sorted) {
        const t = Math.min(k.T, tt), [x, y] = posAt(k, t);
        ball(f.X(x), f.Y(y), p.color, 1, 0.62, true);
        if (t < k.T) continue;
        ctx.font = font(750, 1.1);
        const label = p.name + "  " + fmtLen(k.R), w = ctx.measureText(label).width + 1.4 * R, lx = f.X(k.R);
        let ly = f.ground - 2 * R;
        const hit = (yy) => boxes.some((b) => lx + w / 2 > b.x0 && lx - w / 2 < b.x1 && yy + R > b.y0 && yy - R < b.y1);
        while (hit(ly) && ly > f.top) ly -= 2.3 * R;
        boxes.push({ x0: lx - w / 2, x1: lx + w / 2, y0: ly - R, y1: ly + R });
        if (ly < f.ground - 2 * R) { ctx.strokeStyle = p.color; ctx.lineWidth = 0.1 * R; ctx.beginPath(); ctx.moveTo(lx, f.ground - 0.8 * R); ctx.lineTo(lx, ly + R); ctx.stroke(); }
        tag("cmp-" + p.id, lx, ly, `\\text{${p.name}}\\;\\; ${texLen(k.R)}`, p.color, { fixed: true });
      }
    } else {
      for (const g of ghosts) {
        ctx.save(); ctx.setLineDash([0.5 * R, 0.5 * R]); ctx.strokeStyle = C.muted; ctx.globalAlpha = 0.6; ctx.lineWidth = 0.14 * R;
        ctx.beginPath(); for (let i = 0; i <= 60; i++) { const [x, y] = posAt(g, (g.T * i) / 60); i ? ctx.lineTo(f.X(x), f.Y(y)) : ctx.moveTo(f.X(x), f.Y(y)); } ctx.stroke(); ctx.restore();
      }
      ghosts.forEach((g, i) => tag("ghost" + i, f.X(g.R), f.ground - 0.5 * R, `${g.a}^\\circ,\\ ${g.v}\\,\\text{m/s}`, C.muted, { at: "above", size: 1 }));
      if (step === 3 && trio) {
        const tt = elapsed(trio);
        const cols = { 30: C.sky, 45: C.accent, 60: C.coral };
        for (const k of trio.ks) {
          const t = Math.min(k.T, tt);
          trail(f, k, t, cols[k.a], 0.26 * R, 0);
          const [x, y] = posAt(k, t);
          ball(f.X(x), f.Y(y), cols[k.a], 1, 0.6, true);
          if (t < k.T) busy = true;
          else tag("trio" + k.a, f.X(k.vx * k.T / 2), f.Y(k.Hm), `\\theta = ${k.a}^\\circ`, cols[k.a], { at: "above" });
        }
        if (tt >= Math.max(...trio.ks.map((k) => k.T))) {
          const k45 = trio.ks.find((k) => k.a === 45), k30 = trio.ks.find((k) => k.a === 30);
          tag("trioR", f.X(k30.R), f.ground - 0.6 * R, `R_{30^\\circ} = R_{60^\\circ} = ${texLen(k30.R)}`, C.fg, { at: "above-left" });
          tag("trioR45", f.X(k45.R), f.ground - 0.6 * R, `R_{45^\\circ} = \\hl{${texLen(k45.R)}}`, C.accent, { at: "above-right" });
        }
        cannon(f, 45, 1);
      } else {
        const k = flight ? flight.k : null;
        let t = 0, done = false;
        if (k) {
          t = Math.min(k.T, elapsed(flight));
          done = flight.done || t >= k.T;
          if (done && !flight.done) { flight.done = true; t = k.T; const [x] = posAt(k, k.T); puff(f.X(x), f.ground, Math.PI / 2, mix(C.bg, P().land, 0.7), 22, 2.2, 6); }
          if (done) t = k.T;
          if (!done) busy = true;
          trail(f, k, t, C.sun, 0.34 * R, step >= 2 ? 10 : 0);
          if (done) markers(f, k);
        }
        cannon(f, flight ? flight.angle : angle);
        if (!flight) { if (aim(f, now, true)) busy = true; }
        else if (done && step < 3) { ctx.save(); ctx.globalAlpha = 0.45; aim(f, now, false); ctx.restore(); }
        if (k) {
          if (step >= 2) {
            if (done) { vectors(f, k, k.T * 0.15, false); vectors(f, k, k.T / 2, true); vectors(f, k, k.T * 0.85, false); }
            else vectors(f, k, t, true);
          }
          const [x, y] = posAt(k, t);
          ball(f.X(x), f.Y(y), C.sun, 1, 0.78, true);
          if (!done) tag("t", f.X(x), f.Y(y) - 0.9 * R, `t = ${fmt(t, 2)}\\,\\text{s}`, C.sun, { at: "above", size: 1.05 });
        }
      }
    }
    if (particles.length) { busy = true; drawParticles(); }
    tagsEnd();
    return busy;
  }

  function tick(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
    stepParticles(dt);
    if (draw(now)) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf) { lastT = 0; raf = requestAnimationFrame(tick); } }

  /* ---------------------------------------------------------- equation card */
  /* One line of maths in the equation card. \hl{…} marks the term that changes. */
  function eqLine(src, cls = "line") {
    const el = document.createElement("div"); el.className = cls;
    tex(el, src);
    return el;
  }
  function renderEq(swap) {
    const box = $("eq"), k = kin(angle, speed, P().g), g = P().g;
    box.textContent = "";
    const head = document.createElement("span"); head.className = "k"; box.appendChild(head);
    const vals = document.createElement("div"); vals.className = "vals";
    if (step === 0) {
      head.textContent = "Launch velocity";
      box.appendChild(eqLine(`v_x = v\\cos\\hl{\\theta}, \\quad v_y = v\\sin\\hl{\\theta}`));
      rich(vals, `$v = ${speed}\\,\\text{m/s}$ &nbsp; $\\theta = ${angle}^\\circ$`);
    } else if (step === 1) {
      head.textContent = "Height after time t";
      box.appendChild(eqLine(`y = v\\sin\\theta\\, t \\hl{{}- \\tfrac{1}{2} g t^2}`));
      rich(vals, `$g = ${g}\\,\\text{m/s}^2$ pulls down &nbsp;·&nbsp; $T = ${fmt(k.T, 2)}\\,\\text{s}$`);
    } else if (step === 2) {
      head.textContent = "Split the velocity";
      box.appendChild(eqLine(`v_x = v\\cos\\theta = \\hl{${fmt(k.vx)}\\,\\text{m/s}}`));
      box.appendChild(eqLine(`v_y = v\\sin\\theta \\hl{{}- g t}`));
      rich(vals, `ghosts every $\\Delta t = ${fmt(k.T / 10, 2)}\\,\\text{s}$`);
    } else if (step === 3) {
      head.textContent = "Range";
      box.appendChild(eqLine(`R = \\dfrac{v^2 \\hl{\\sin 2\\theta}}{g}`));
      rich(vals, `$\\sin 60^\\circ = \\sin 120^\\circ$ &nbsp;·&nbsp; $\\sin 90^\\circ = 1$ is the biggest`);
    } else {
      head.textContent = "Range on each world";
      box.appendChild(eqLine(`R = \\dfrac{v^2 \\sin 2\\theta}{\\hl{g}}`));
      rich(vals, `Moon $${texLen(kin(angle, speed, 1.6).R)}$ vs Earth $${texLen(kin(angle, speed, 9.8).R)}$`);
    }
    box.appendChild(vals);
    if (swap) { box.classList.remove("swap"); void box.offsetWidth; box.classList.add("swap"); }
  }

  /* ---------------------------------------------------------- actions */
  function launch(animate = true) {
    if (flight && flight.done && (flight.angle !== angle || flight.speed !== speed || flight.planet !== planet)) {
      ghosts.unshift(flight.k); ghosts = ghosts.slice(0, 2);
    }
    const k = kin(angle, speed, P().g);
    const pf = Math.max(1, k.T / 3.2);
    flight = { k, angle, speed, planet, pf, t0: performance.now(), done: !animate || reduced };
    setSpan(wantSpan([k, ...ghosts]), animate);
    if (animate && !reduced) {
      const f = frame(), mx = f.X(0) + Math.cos(angle * DEG) * 3.9 * R, my = f.ground - Math.sin(angle * DEG) * 3.9 * R;
      puff(mx, my, angle * DEG, mix(C.bg, C.fg, 0.35), 26, 0.9, 7);
    }
    renderEq(false);
    kick();
  }
  function runTrio(animate = true) {
    const ks = [30, 45, 60].map((a) => kin(a, speed, P().g));
    trio = { ks, pf: Math.max(1, Math.max(...ks.map((k) => k.T)) / 3.6), t0: animate && !reduced ? performance.now() : -1e12 };
    setSpan(wantSpan(ks), animate);
    if (animate && !reduced) { const f = frame(); puff(f.X(0) + 2.8 * R, f.ground - 2.8 * R, 45 * DEG, mix(C.bg, C.fg, 0.35), 30, 1.4, 7); }
    kick();
  }
  function runCompare(animate = true) {
    const ks = PLANETS.map((p) => kin(angle, speed, p.g));
    compare = { pf: Math.max(1, Math.max(...ks.map((k) => k.T)) / 5), t0: animate && !reduced ? performance.now() : -1e12 };
    setSpan(wantSpan(ks), animate);
    if (animate && !reduced) { const f = frame(); puff(f.X(0) + Math.cos(angle * DEG) * 3 * R, f.ground - Math.sin(angle * DEG) * 3 * R, angle * DEG, mix(C.bg, C.fg, 0.35), 34, 1.2, 7); }
    kick();
  }
  function relaunch(animate) {
    if (step === 0) { flight = null; setSpan(wantSpan([kin(angle, speed, P().g), ...ghosts]), animate); kick(); }
    else if (step === 3) runTrio(animate);
    else if (step >= 4) runCompare(animate);
    else launch(animate);
  }
  function persist() { rupok.state.save({ angle, speed, planet }); }

  /* ---------------------------------------------------------- input: drag the arrow */
  function pointerPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener("pointerdown", (e) => {
    if (step === 3 || step >= 4 || (flight && !flight.done)) return;
    const f = frame(), [x, y] = pointerPos(e), [tx, ty] = aimTip(f);
    const nearTip = Math.hypot(x - tx, y - ty) < 2.6 * R;
    const nearBarrel = Math.hypot(x - f.X(0), y - f.ground) < 5 * R;
    if (!nearTip && !nearBarrel) return;
    drag = { mode: nearTip ? "tip" : "angle" };
    cv.setPointerCapture(e.pointerId);
    if (flight && flight.done) { ghosts.unshift(flight.k); ghosts = ghosts.slice(0, 2); flight = null; }
    kick();
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const f = frame(), [x, y] = pointerPos(e);
    const dx = x - f.X(0), dy = f.ground - y;
    angle = Math.round(Math.max(5, Math.min(85, Math.atan2(dy, dx) / DEG)));
    if (drag.mode === "tip") speed = Math.round(Math.max(5, Math.min(40, (Math.hypot(dx, dy) - 3.7 * R) / (K_ARROW * R))));
    renderEq(false); kick();
  });
  const endDrag = () => { if (!drag) return; drag = null; persist(); setSpan(wantSpan([kin(angle, speed, P().g), ...ghosts])); kick(); };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);

  /* ---------------------------------------------------------- dock */
  for (let i = 0; i <= STEPS; i++) $("dots").appendChild(document.createElement("i"));
  for (const p of PLANETS) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.id = p.id;
    b.innerHTML = `<span class="orb" style="background:${p.color}"></span><span>${p.name}</span><small>${p.g}</small>`;
    b.setAttribute("aria-label", `${p.name}, g = ${p.g} metres per second squared`);
    b.addEventListener("click", () => {
      planet = p.id; syncChips(); persist();
      if (step >= 1 && step <= 3) relaunch(true); else { renderEq(false); setSpan(wantSpan([kin(angle, speed, P().g)])); kick(); }
    });
    $("planets").appendChild(b);
  }
  function syncChips() {
    document.querySelectorAll(".chip").forEach((b) => { const on = b.dataset.id === planet; b.classList.toggle("on", on); b.setAttribute("aria-pressed", String(on)); });
    $("planets").classList.toggle("locked", step >= 4);
  }
  $("launch").addEventListener("click", () => { if (step === 0) rupok.steps.next(); else relaunch(true); });
  $("clear").addEventListener("click", () => { ghosts = []; kick(); });

  /* ---------------------------------------------------------- steps */
  function renderStep(s, info) {
    const animate = !info || info.source !== "init";
    const prev = step;
    step = s;
    rich($("caption"), CAPTIONS[s]);
    document.querySelectorAll("#dots i").forEach((d, i) => { d.classList.toggle("on", i <= s); d.classList.toggle("now", i === s); });
    syncChips();
    if (s === 0) ghosts = [];
    if (s !== 3) trio = null;
    if (s < 4) compare = null;
    if (s === 0 || s >= 3) relaunch(animate);
    else if (s === 1 || prev === 0 || !flight || prev >= 3) { if (s === 1) ghosts = []; relaunch(animate); }
    else if (s === 2 && prev === 1) relaunch(animate);
    renderEq(animate);
    kick();
  }

  function measure() {
    W = innerWidth; H = innerHeight;
    R = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    measure();
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    kick();
  }

  readTheme();
  measure();
  syncChips();
  span = spanFrom = spanTo = wantSpan([kin(angle, speed, P().g)]);
  new ResizeObserver(resize).observe(document.documentElement);
  rupok.theme.onChange(() => { readTheme(); renderEq(false); kick(); });
  rupok.steps.setCount(STEPS);
  rupok.ready.then(() => {
    const saved = rupok.state.load();
    if (saved && typeof saved === "object") {
      if (Number.isFinite(saved.angle)) angle = Math.max(5, Math.min(85, Math.round(saved.angle)));
      if (Number.isFinite(saved.speed)) speed = Math.max(5, Math.min(40, Math.round(saved.speed)));
      if (PLANETS.some((p) => p.id === saved.planet)) planet = saved.planet;
    }
    readTheme(); syncChips();
    span = spanFrom = spanTo = wantSpan([kin(angle, speed, P().g)]);
    rupok.steps.onChange(renderStep);
  });
</script>
</body>
</html>
