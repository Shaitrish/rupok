name: Desktop

# Builds the Rupok desktop app (apps/desktop, Tauri 2) for Windows and Linux:
# the wasm engine, the board (apps/board), then the installers.
# - every push to main and every PR touching the app: installers as workflow artifacts
# - tags v*: a draft GitHub Release with the installers attached
# Signing is not configured yet, so forks build unsigned installers with no secrets.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "spec/**", "skills/**", "examples/**"]
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "packages/object-sdk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write # create the draft release on tags

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS, MSI)
            os: windows-latest
            artifact: rupok-windows
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
          - name: Linux (deb, AppImage)
            os: ubuntu-22.04
            artifact: rupok-linux
            paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            patchelf file libfuse2

      # Installs the pinned toolchain (rust-toolchain.toml) with the wasm target.
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
          cache-on-failure: true

      - name: Cache wasm-bindgen CLI
        id: wasm-bindgen-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen.exe
          key: wasm-bindgen-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}

      - name: Install wasm-bindgen CLI
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked

      - name: Build the board engine (wasm)
        shell: bash
        run: |
          cargo build -p rupok-wasm --target wasm32-unknown-unknown --profile release-wasm
          wasm-bindgen --target web --out-dir apps/board/src/wasm --out-name rupok \
            target/wasm32-unknown-unknown/release-wasm/rupok_wasm.wasm

      - uses: oven-sh/setup-bun@v2

      - name: Build the board
        working-directory: apps/board
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install desktop tooling (Tauri CLI)
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      # The Tauri code is behind the `app` feature (the root CI stays free of
      # WebKitGTK), so lint it here where the system libraries exist.
      - name: Clippy (desktop app)
        if: runner.os == 'Linux'
        run: cargo clippy -p rupok-desktop --features app -- -D warnings

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          # Only on v* tags: create (or reuse) a draft release and attach the installers.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Rupok {0}', github.ref_name) || '' }}
          releaseBody: Desktop installers for Windows (NSIS .exe, MSI) and Linux (.deb, AppImage). See the assets below.
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
