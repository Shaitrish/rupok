name: Deploy to rupok.app

# Builds the board (Rust → wasm + Vite) and deploys it to Cloudflare.
# Requires repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit,
# Workers Routes:Edit, Zone:Read for rupok.app and shaitrish.com) and CLOUDFLARE_ACCOUNT_ID,
# plus the repository variable DEPLOY_ENABLED=true. Until that variable is set
# (and on forks) the job is skipped instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build board engine (wasm)
        run: |
          cargo build -p rupok-wasm --target wasm32-unknown-unknown --profile release-wasm
          wasm-bindgen --target web --out-dir apps/board/src/wasm --out-name rupok \
            target/wasm32-unknown-unknown/release-wasm/rupok_wasm.wasm
      - uses: oven-sh/setup-bun@v2
      - name: Build web app
        working-directory: apps/board
        run: |
          bun install --frozen-lockfile
          bun run vendor   # offline Smart Object libraries -> public/rupoklib/
          bunx vite build
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/board
