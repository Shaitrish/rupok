# Weekly dependency updates, grouped so each ecosystem opens at most two PRs:
# one for minor and patch updates, one for major updates (which may need code
# changes). Security fixes arrive immediately regardless.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch: { update-types: [minor, patch] }
      cargo-major: { update-types: [major] }
  - package-ecosystem: npm
    directory: /apps/board
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
      npm-major: { update-types: [major] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch: { update-types: [minor, patch] }
      actions-major: { update-types: [major] }
